<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVERFREEZE</title>
<style>
:root{
  --ink:#2b2a35; --ink2:#5a586b; --paper:#fffdf8; --line:#d9d4c7;
  --npc:#5b8fc9; --inspect:#d99a2b; --puzzle:#8a63c9; --move:#4aa070;
  --accent:#6b5bd6; --bad:#c9503c;
  --font:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink)}
#stagewrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#000}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:#000;user-select:none}
button{font-family:inherit;cursor:pointer}

/* 배경 */
.scene{position:absolute;inset:0;transition:filter .6s}
.wm{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:84px;font-weight:800;color:rgba(255,255,255,.34);letter-spacing:.04em;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.04)}
.wm::after{content:'배경 이미지 자리';display:block;font-size:15px;font-weight:600;letter-spacing:.2em;color:rgba(0,0,0,.22);margin-top:6px}
.fx{position:absolute;inset:0;pointer-events:none;transition:opacity .8s}

/* 오류 단계 연출 (단계 누적 · 전역) */
#stage[data-stage="2"] .scene{filter:saturate(.92)}
#stage[data-stage="2"] .fx{background:radial-gradient(ellipse at center,transparent 60%,rgba(60,40,90,.14) 100%)}
#stage[data-stage="3"] .scene{filter:saturate(.78) hue-rotate(-8deg)}
#stage[data-stage="3"] .fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 2px,transparent 2px 5px),radial-gradient(ellipse at center,transparent 50%,rgba(60,30,90,.22) 100%)}
#stage[data-stage="4"] .scene{filter:saturate(.6) hue-rotate(-18deg) contrast(1.05);animation:jitter 5s steps(1) infinite}
#stage[data-stage="4"] .fx{background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px),linear-gradient(90deg,rgba(255,0,80,.05),transparent 30%,transparent 70%,rgba(0,200,255,.06)),radial-gradient(ellipse at center,transparent 40%,rgba(40,10,70,.34) 100%)}
#stage[data-stage="5"] .scene{filter:grayscale(.78) brightness(.94)}
#stage[data-stage="5"] .fx{background:radial-gradient(ellipse at center,transparent 55%,rgba(20,20,30,.3) 100%)}
@keyframes jitter{0%,92%,100%{transform:none}93%{transform:translateX(5px)}95%{transform:translateX(-6px) skewX(.6deg)}97%{transform:translateX(3px)}}
#stage[data-stage="5"] *{animation-play-state:paused}

/* 핫스팟 */
.hotspots{position:absolute;inset:0}
.hs{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid rgba(255,255,255,.55);border-radius:18px;background:rgba(255,255,255,.34);color:var(--ink);backdrop-filter:blur(1px);transition:transform .12s,background .12s,box-shadow .12s;padding:6px}
.hs .ico{font-size:54px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.hs .lbl{font-size:20px;font-weight:700;background:rgba(255,253,248,.92);border-radius:10px;padding:3px 10px;max-width:100%;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hs:hover{background:rgba(255,255,255,.62);transform:translateY(-3px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.hs:active{transform:scale(.98)}
.hs-npc{border-radius:50% 50% 18px 18px / 40% 40% 18px 18px}
#stage.hints .hs{border-style:solid;border-width:3px}
#stage.hints .hs-npc{border-color:var(--npc)} #stage.hints .hs-inspect{border-color:var(--inspect)}
#stage.hints .hs-puzzle{border-color:var(--puzzle)} #stage.hints .hs-move{border-color:var(--move)}
#stage.hints .hs.temp{border-style:dashed}
#stage.hints .hs.temp::after{content:'임시';position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 6px}


/* 장소 소개말 / 토스트 / 배너 */
.toasts{position:absolute;right:18px;top:70px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;z-index:30}
.toast{background:rgba(35,32,52,.92);color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;animation:toastIn .25s ease}
.toast.gain{background:#4a3fb5}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}}
.banner{position:absolute;left:50%;top:120px;transform:translateX(-50%);text-align:center;color:#fff;background:rgba(40,16,60,.84);padding:12px 30px;border-radius:16px;opacity:0;pointer-events:none;z-index:25}
.banner b{display:block;font-size:20px;margin-bottom:4px}
.banner span{font-size:16px;opacity:.9}
.banner.show{animation:bannerAnim 3.6s ease forwards}
@keyframes bannerAnim{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}

/* 오버레이 공통 */
.scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px}
.scrim.dim{background:rgba(20,18,30,.55);align-items:center;padding:0}
.textbox{width:960px;min-height:150px;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:22px 28px;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;animation:rise .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.textbox .who{font-weight:800;margin-bottom:6px}
.textbox .body{font-size:22px;line-height:1.55}
.textbox .note{margin-top:10px;font-size:14px;color:var(--move);font-weight:700}
.textbox .next{position:absolute;right:22px;bottom:12px;font-size:13px;color:var(--ink2)}
.textbox.dialogue{display:flex;gap:22px;align-items:flex-start}
.portrait{flex:none;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff;border:3px solid var(--ink)}
.dcol{flex:1}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dhead b{font-size:20px}.dhead .role{font-size:14px;color:var(--ink2)}
.dhead .ctx{font-size:12px;background:#ece8ff;color:var(--accent);border-radius:8px;padding:2px 8px;font-weight:700}
.textbox.dialogue .close{align-self:flex-end}

/* 퍼즐 */
.puzzle{width:720px;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:26px 30px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.puzzle h3{margin:0 0 8px;font-size:22px}
.puzzle .prompt{margin:0 0 18px;font-size:18px;line-height:1.5}
.parea{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:17px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--puzzle)}
.opt.on{border-color:var(--puzzle);background:#f1eaff}
.opt:disabled{opacity:.35;cursor:default}
.seq{display:flex;gap:8px;flex-wrap:wrap}
.slot{flex:1;min-width:130px;border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-size:15px;color:var(--ink2);min-height:48px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--puzzle);background:#f1eaff;color:var(--ink);font-weight:600}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.code{font-size:30px;text-align:center;letter-spacing:.3em;border:2px solid var(--line);border-radius:12px;padding:10px;width:200px;margin:0 auto;font-family:var(--font)}
.pmsg{min-height:24px;margin:14px 0 4px;color:var(--bad);font-weight:600}
.pactions{display:flex;justify-content:flex-end;gap:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 엔딩 */
.ending{width:640px;background:#f4f1ea;border:2px solid var(--ink);border-radius:20px;padding:34px 40px;text-align:center;line-height:1.7;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.ending h2{margin:0 0 16px;font-size:26px}.ending p{margin:0;font-size:18px}.ending .btn{margin-top:22px}

/* 추리 수첩 */
.notebook{width:1160px;height:640px;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:20px 26px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.nb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nb-head h2{margin:0;font-size:24px}
.nb-cols{flex:1;display:grid;grid-template-columns:400px 1fr;gap:26px;min-height:0}
.nb-left,.nb-right{overflow:auto;padding-right:6px}
.nb-left h4,.nb-right h4{margin:12px 0 6px;font-size:15px;color:var(--ink2)}
.evlist{display:flex;flex-wrap:wrap;gap:6px}
.ev{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:14px}
.ev:hover{border-color:var(--accent)}.ev.picked{background:#e9e4ff;border-color:var(--accent)}
.empty{color:var(--ink2);font-size:14px}
.evdetail{margin-top:14px;padding:12px 14px;background:#f4f1ea;border-radius:12px;font-size:15px;line-height:1.5}
.evdetail .place{margin-left:8px;font-size:12px;color:var(--ink2)}.evdetail p{margin:6px 0 0}
.dcard{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:10px}
.dcard.active{border:2px solid var(--accent)}
.dcard.solved{background:#f0f8f2;border-color:#9bcfae}
.dtop{display:flex;justify-content:space-between;align-items:center}
.dtop .tag{font-size:12px;border-radius:8px;padding:2px 8px;background:#eee;color:var(--ink2)}
.dcard.solved .tag{background:var(--move);color:#fff}
.dcard p{margin:6px 0}.dcard .sub{color:var(--ink2);font-size:14px}.dcard .hypo{font-size:15px}
.dcard .msg{color:var(--bad);font-weight:600;font-size:14px}
.slots{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.slots .slot{min-width:150px;flex:none;cursor:pointer}
.row{display:flex;gap:8px}

/* DEV */
.devpanel{position:absolute;right:12px;top:12px;width:360px;max-height:600px;overflow:auto;z-index:40;background:rgba(20,18,30,.94);color:#fff;border-radius:12px;padding:12px;font-size:12px;display:flex;flex-direction:column;gap:8px}
.devpanel select{width:100%;padding:4px}
.devev{display:flex;flex-wrap:wrap;gap:4px}
.devev button{background:#333;color:#ddd;border:1px solid #555;border-radius:6px;padding:2px 6px;font-size:11px}
.devev button.on{background:#6b5bd6;color:#fff}
.devpanel .row button{background:#444;color:#fff;border:0;border-radius:6px;padding:4px 10px}
.devflags{color:#bbb;line-height:1.5;word-break:break-all}

/* ===== 사이트 틀 (옛날 홈페이지 느낌) ===== */
body{background:#efe9dc;background-image:radial-gradient(rgba(120,100,70,.10) 1px,transparent 1px);background-size:14px 14px}
#site{max-width:1240px;margin:0 auto;padding:18px 16px 28px}
#masthead{background:#fffdf8;border:3px double #8a7b62;border-radius:8px;padding:16px 22px;text-align:center;box-shadow:3px 3px 0 rgba(90,75,50,.25)}
.logo{font-size:40px;font-weight:800;letter-spacing:.18em;color:#4b3f63}
.tagline{margin-top:6px;font-size:15px;color:var(--ink2)}
#page{background:#fffdf8;border:3px double #8a7b62;border-radius:8px;padding:14px 16px 18px;box-shadow:3px 3px 0 rgba(90,75,50,.25)}
#caption{margin-top:14px;padding:6px 4px 0}
#caption h2{margin:0 0 6px;font-size:24px;color:#4b3f63}
#pintro{margin:0 0 8px;font-size:17px;line-height:1.6}
.tip{margin:0;font-size:13px;color:var(--ink2)}
.tip a{color:#3b5bb5}
#foot{margin-top:14px;text-align:center;font-size:13px;color:var(--ink2)}
#foot .sep{margin:0 10px;color:#bbb}
.devlink{margin-left:12px;color:#aaa;font-size:11px}
/* 단계가 오르면 사이트 틀도 조금씩 어긋난다 */
body[data-stage="3"] #masthead .logo{letter-spacing:.14em}
body[data-stage="4"] #masthead{border-style:dashed}
body[data-stage="4"] .tagline{opacity:.75}
body[data-stage="5"]{filter:grayscale(.55)}
body[data-stage="5"] .tagline{letter-spacing:.3em}
.banner{top:70px}

/* 버튼 (이전 정리 때 빠져 있던 공통 버튼 스타일 복구) */
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 11px;font-size:14px}
.badge{margin-left:7px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}

/* 뒤로가기: 그림 아래쪽 가장자리. 마우스를 대면 커서가 아래 화살표로 바뀌고, 클릭하면 한 단계 나간다 */
.edge-back{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:6;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><path d='M18 31 L5 15 H13 V4 H23 V15 H31 Z' fill='white' stroke='black' stroke-width='2.4' stroke-linejoin='round'/></svg>") 18 31, s-resize;
  transition:background .15s}
.edge-back:hover{background:linear-gradient(0deg,rgba(20,18,30,.30),rgba(20,18,30,0))}
/* 설정 showMemo 를 켰을 때만 생기는 메모 버튼 */
.memo-btn{position:absolute;right:14px;top:14px;z-index:7;border:1px solid var(--line);background:rgba(255,253,248,.94);border-radius:12px;padding:7px 12px;font-size:15px;font-weight:700}

/* ===== 퍼즐 유형별 화면 (src/ui/pz.js) ===== */
.textbox .body{white-space:pre-line}
.puzzle{max-height:680px;overflow:auto}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phead h3{margin:0}
.plevel{font-size:12px;font-weight:700;background:#f1eaff;color:var(--puzzle);border-radius:8px;padding:2px 8px}
.phint{display:none;margin:4px 0 10px;padding:10px 14px;border-radius:12px;background:#fff6dc;border:1px dashed #d9b24a;font-size:15px;line-height:1.5}
.phint.on{display:block}
.pz-list{display:flex;flex-direction:column;gap:8px}
.row.center{justify-content:center;align-items:center;gap:14px;margin-top:10px}

/* 다이얼 · 회전 링 */
.wheels{display:flex;justify-content:center;gap:18px;padding:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:64px;height:34px;font-size:16px}
.wbtn:hover{border-color:var(--puzzle)}
.wnum{width:64px;height:76px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;border:2px solid var(--ink);border-radius:12px;background:linear-gradient(180deg,#eee 0%,#fff 30%,#fff 70%,#eee 100%)}
.wlabel{font-size:13px;color:var(--ink2);font-weight:700;min-height:18px}
.wheels.rings .wnum{width:96px;height:96px;border-radius:50%;border:0;color:#4a3420;
  background:repeating-radial-gradient(circle,#d9b98a 0 5px,#c49a64 5px 8px);box-shadow:inset 0 0 0 3px #7a5a34;position:relative}
.wheels.rings .wnum::after{content:'';position:absolute;inset:6px;border-radius:50%;border-top:4px solid rgba(80,50,20,.6);transform:rotate(var(--rot,0deg));transition:transform .2s}

/* 시계 맞추기 */
.clockbox{display:flex;align-items:center;justify-content:center;gap:28px}
.clockface{width:210px;height:210px}
.cf-rim{fill:#fffdf8;stroke:var(--ink);stroke-width:4}
.cf-num{font-size:17px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.cf-h{stroke:var(--ink);stroke-width:7;stroke-linecap:round;transition:transform .2s}
.cf-m{stroke:var(--puzzle);stroke-width:4;stroke-linecap:round;transition:transform .2s}
.cf-pin{fill:var(--ink)}
.clock-side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.clock-label{font-size:28px;font-weight:800}
.clock-ctl{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;align-items:center}
.cl-t{font-weight:700;color:var(--ink2)}

/* 레버 */
.levers{display:flex;justify-content:center;gap:26px;padding:6px 0}
.lever{position:relative;width:76px;height:150px;border:2px solid var(--line);border-radius:14px;background:#f6f3ec}
.lever .stick{position:absolute;left:34px;top:30px;width:8px;height:60px;background:#777;border-radius:4px;transform-origin:50% 100%;transition:transform .2s}
.lever .knob{position:absolute;left:22px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid var(--ink);z-index:1;transition:top .2s}
.lever .lname{position:absolute;left:0;right:0;bottom:8px;font-weight:700;font-size:15px}
.lever.down .knob{top:70px}.lever.down .stick{transform:scaleY(-.2)}
.lever:disabled{cursor:default;opacity:.85}
.lever-trail{display:flex;gap:6px}
.dot{min-width:46px;padding:4px 8px;border:2px dashed var(--line);border-radius:10px;font-size:13px;text-align:center;color:var(--ink2)}
.dot.on{border-style:solid;border-color:var(--ink);color:#fff;font-weight:700}

/* 슬라이드 3×3 */
.slidegrid{display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:repeat(3,96px);gap:6px;justify-content:center;padding:6px;background:#6f5a48;border-radius:14px;width:max-content;margin:0 auto}
.stile{border:0;border-radius:10px;background:#f4e8d0;font-size:46px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);cursor:default}
.stile.movable{cursor:pointer;outline:3px solid rgba(138,99,201,.55)}
.stile.movable:hover{background:#fff}
.stile.empty{background:transparent;box-shadow:none}

/* 암호 */
.cipher-syms{display:flex;justify-content:center;gap:16px;font-size:44px;padding:4px 0}
.csym{width:70px;height:70px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:12px;background:#f4f1ea}
.cipher-legend{display:flex;justify-content:center;gap:22px;color:var(--ink2);font-size:16px;margin:4px 0 6px}

/* 등대 신호 */
.sigpad{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.sig{display:flex;flex-direction:column;align-items:center;gap:2px;width:90px;padding:8px;border:2px solid var(--line);background:#fff;border-radius:14px;font-weight:700}
.sig .ico{font-size:32px}
.sig:hover:not(:disabled){border-color:var(--puzzle)}
.sig:disabled{opacity:.4;cursor:default}

/* 유리 조각 2×2 */
.glassgrid{display:grid;grid-template-columns:repeat(2,150px);gap:10px;justify-content:center;padding:10px;background:#3b3446;border-radius:16px;width:max-content;margin:0 auto}
.gcell{position:relative;width:150px;height:150px;border-radius:12px}
.gcell.sel{outline:4px solid #f3dc8a}
.gpiece{width:100%;height:100%;border:2px solid rgba(255,255,255,.7);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1f1c2b;transition:transform .2s;opacity:.92}
.gtri{font-size:30px;line-height:1}
.gname{font-size:18px;font-weight:800;background:rgba(255,255,255,.7);border-radius:8px;padding:1px 8px}
.grot{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;z-index:1}
.pz-signal .seq{flex-wrap:nowrap}.pz-signal .slot{min-width:0}

/* ===== 클로즈업 장면 (src/ui/closeup.js) — 그림 창 전체가 물건 가까이로. 글 없음 ===== */
.closeup{position:absolute;inset:0;z-index:18;display:flex;background:#1b1824;animation:cuIn .22s ease-out}
.closeup>*:first-child{flex:1}
@keyframes cuIn{from{opacity:0;transform:scale(1.04)}}
.closeup.quiet>*:first-child{filter:grayscale(1) brightness(.8)}

/* 그림(임시: 큰 아이콘) */
.cv-pic{display:flex;align-items:center;justify-content:center;position:relative;background-size:cover;background-position:center}
.cv-icon{font-size:300px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.4))}
.cv-tag{position:absolute;left:14px;top:12px;font-size:13px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.25);padding:2px 8px;border-radius:4px}

/* 종이·표지판·장부·책: 가운데 한 장 */
.cv-doc{display:flex;align-items:center;justify-content:center;padding:40px;color:#2f2a24;font-family:'Nanum Myeongjo','Noto Serif KR',serif;background:#3b3026;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 4px,transparent 4px 18px)}
.d-sheet{min-width:560px;max-width:1080px;padding:34px 48px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center}
.paper-note .d-sheet{width:640px;background:repeating-linear-gradient(180deg,#fbf6ea 0 55px,#d9e2ef 55px 57px);transform:rotate(-1.5deg)}
.paper-note .d-line{align-self:stretch;margin:0;height:57px;line-height:57px;font-size:38px}
.paper-note.blur .d-line{background:linear-gradient(90deg,rgba(60,70,110,.5),rgba(60,70,110,.15) 70%,transparent);background-size:100% 10px;background-repeat:no-repeat;background-position:0 60%;filter:blur(3px)}
.paper-book .d-sheet,.cv-doc.paper-book{background-color:#3b3026}
.paper-book .d-sheet{width:760px;background:linear-gradient(90deg,#efe3c8,#f8f0dc 10%,#f8f0dc 90%,#e8dbbd)}
.paper-book .d-line{margin:10px 0;font-size:48px;letter-spacing:.1em}
.paper-sign .d-sheet{background:#f3ead6;border:14px solid #7a5a38;border-radius:10px}
.paper-sign .d-line{margin:6px 0;font-size:64px;font-weight:800}
.paper-ledger .d-sheet{background:#f4ecd8;width:1000px}
.d-head{font-size:40px;font-weight:800;margin-bottom:14px}
.d-table{border-collapse:collapse;font-size:30px;width:100%}
.d-table th{border-bottom:3px solid #6b5a48;padding:6px 12px;text-align:center;font-size:34px}
.d-table td{border-bottom:1px solid #d8cbb0;padding:6px 12px;text-align:center;font-variant-numeric:tabular-nums}
.paper-sign .d-table{font-size:64px}.paper-sign .d-table th{font-size:30px}
.d-foot{margin-top:16px;font-size:40px;align-self:flex-end}
.paper-note .d-foot{font-size:30px;color:#777}

/* 하루 순서 띠 */
.cv-strip{display:flex;align-items:center;justify-content:center;background:#3b3026}
.st-sheet{display:flex;align-items:center;gap:18px;padding:40px 50px;background:#e9dcc0;box-shadow:0 18px 40px rgba(0,0,0,.5);
  clip-path:polygon(0 4%,8% 0,20% 5%,34% 1%,50% 4%,66% 0,82% 5%,100% 2%,98% 50%,100% 97%,84% 100%,66% 95%,50% 100%,34% 96%,18% 100%,0 96%,2% 50%)}
.st-icon{font-size:110px}.st-arrow{font-size:56px;color:#6b5a48}

/* 시계 */
.cv-clock{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#d8e2ec,#6f7d8e)}
.cv-clock svg{width:600px;height:600px}
.ck-rim{fill:#f6f1e4;stroke:#3a3346;stroke-width:6}
.ck-tick{stroke:#3a3346;stroke-width:1.5}.ck-tick.big{stroke-width:4}
.ck-num{font-size:20px;font-weight:700;text-anchor:middle;fill:#3a3346;font-family:serif}
.ck-h{stroke:#3a3346;stroke-width:8;stroke-linecap:round}
.ck-m{stroke:#3a3346;stroke-width:4;stroke-linecap:round}
.ck-pin{fill:#3a3346}
.cv-clock .ck-h{stroke-width:11}.cv-clock .ck-m{stroke:#9a2f2f;stroke-width:2.5}
.ck-dir{fill:none;stroke:rgba(58,51,70,.35);stroke-width:3;stroke-linecap:round}

/* 해파리 조명 */
.cv-lights{display:flex;align-items:center;justify-content:center;gap:90px;background:radial-gradient(ellipse,#1f3a4a,#0c1820)}
.bulb{width:150px;height:150px;border-radius:50% 50% 44% 44%;background:var(--c);opacity:.12;animation-name:bulbOn;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
@keyframes bulbOn{0%{opacity:.12;box-shadow:none}1%,22%{opacity:1;box-shadow:0 0 70px 20px var(--c)}23%,100%{opacity:.12;box-shadow:none}}

/* 망토 도안 */
.cv-pattern{display:flex;flex-direction:column;justify-content:center;gap:20px;align-items:center;background:#7a3b3b;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)}
.p-row{display:flex;gap:50px;font-size:120px;padding:6px 40px;border-top:3px dashed rgba(255,230,200,.5);border-bottom:3px dashed rgba(255,230,200,.5)}

/* 바느질 단계 */
.cv-steps{display:flex;align-items:center;justify-content:center;background:#f2d9d3;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 2px,transparent 2px 6px)}
.s-row{display:flex;gap:18px;align-items:center}
.s-tag{font-size:70px;color:#7a3b3b;margin-right:24px;background:#fff6dc;border:3px solid #7a3b3b;border-radius:10px;padding:0 16px}
.s-dot{position:relative;width:80px;height:80px;border-radius:50%;border:3px dashed #b88f7a;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff}
.s-dot.done{background:#a2584a;border:3px solid #7a3b3b}
.s-dot.stop{background:#a2584a;border:4px solid #3a1f1f;box-shadow:0 0 0 8px rgba(162,88,74,.25)}
.s-needle{position:absolute;top:-82px;font-size:70px}

/* 붙은 종이들 */
.cv-pins{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:26px;padding:40px}
.paper-cork{background:#b98a5a;background-image:radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.5px);background-size:8px 8px}
.paper-drawer{background:#4e3e30}
.pin-note{position:relative;width:340px;padding:40px 20px;background:#fbf6e2;box-shadow:3px 5px 10px rgba(0,0,0,.35);text-align:center}
.pn-icon{font-size:130px}
.pn-text{font-size:30px}
.pn-mark{position:absolute;right:16px;bottom:10px;font-size:44px;color:#9a2f2f}
.paper-drawer .pin-note{width:230px;padding:22px 12px}
.paper-drawer .pn-icon{font-size:56px}.paper-drawer .pn-text{font-size:26px}

/* 겹친 편지 */
.cv-stack{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#e3d7bd,#9f9078)}
.st-item{position:absolute}
.si-icon{font-size:250px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.si-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-35%);font-size:64px;color:#9a2f2f}

/* 나이테 읽는 법 */
.rg-svg{width:1000px;height:470px;background:#f8f0dc;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.rg-ring{fill:none;stroke:#9b7b52;stroke-width:14;opacity:.75}
.rg-badge{fill:#7a3b3b}
.rg-num{fill:#fff;font-size:20px;font-weight:800;text-anchor:middle}
.rg-arrow{fill:none;stroke:#7a3b3b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.rg-clock{fill:#fffdf6;stroke:#3a3346;stroke-width:6}
.rg-long{stroke:#3a3346;stroke-width:6;stroke-linecap:round}
.rg-short{stroke:#3a3346;stroke-width:12;stroke-linecap:round}
.rg-pin{fill:#3a3346}
.rg-svg .rg-badge+.rg-num{font-size:24px}

/* 상호작용 불가: 그림만 살짝 흔들림 */
#stage.nudge .scene,#stage.nudge .hotspots{animation:nudge .4s ease}
@keyframes nudge{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* 뒤로 가기 화살표: 그림 하단 가운데에 항상 희미하게, 마우스를 대면 진하게 */
.edge-arrow{position:absolute;left:50%;bottom:10px;width:46px;height:30px;margin-left:-23px;pointer-events:none;opacity:.5;transition:opacity .15s;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 30'><path d='M4 5 L23 25 L42 5' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/><path d='M4 5 L23 25 L42 5' fill='none' stroke='%232b2a35' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
  animation:arrowBob 1.8s ease-in-out infinite}
.edge-back:hover .edge-arrow{opacity:1}
@keyframes arrowBob{50%{transform:translateY(5px)}}

</style>
</head>

<script>
/* 장면 + 핫스팟 + 규칙.
   - 좌표는 1280x720 기준 px. (x,y,w,h)
   - 핫스팟 rules 는 위에서부터 검사해 "처음 통과한 규칙"의 do 를 실행한다.
   - 조사(inspect)를 누르면 그 물건의 클로즈업 장면(views.js 의 view)이 열린다. 글로 설명하지 않는다.
   - 아직 상호작용할 수 없는 것(단계 미달·잠김)은 글 없이 화면이 살짝 흔들린다(shake).
   - temp:true 는 임시 요소(힌트 표시를 켜면 점선으로 보임).
   - 배경 이미지는 assets/bg/<장면ID>.png 를 넣고 EF.BG_IMAGES 에 ID 를 적으면 적용된다. */
(function () {
  const EF = window.EF;
  const TX = EF.TEXT;

  // ---------- 배경 헬퍼 ----------
  const room = (wall, floor, at = 66) =>
    `linear-gradient(180deg, ${wall} 0%, ${wall} ${at}%, ${floor} ${at}%, ${floor} 100%)`;
  const sky = (top, bottom, ground, at = 64) =>
    `linear-gradient(180deg, ${top} 0%, ${bottom} ${at}%, ${ground} ${at}%, ${ground} 100%)`;

  // ---------- 핫스팟 헬퍼 ----------
  const hs = (kind, id, label, icon, box, rules, o = {}) =>
    Object.assign({ kind, id, label, icon, x: box[0], y: box[1], w: box[2], h: box[3], rules, temp: false }, o);

  const SHAKE = [{ shake: true }];
  // 잠김 규칙: min(단계 미달) 또는 lock(조건 미충족) → 흔들림
  const lockRule = o => {
    if (o.min) return { if: [{ not: { stageMin: o.min } }], do: SHAKE };
    if (o.lock) return { if: [{ not: o.lock }], do: SHAKE };
    return null;
  };
  // 엔딩 이후: 같은 클로즈업이 열리지만 색이 빠져 있다(모든 것이 멈춘 듯 고요)
  const quiet = (view, icon) => [{ view: view || { kind: 'pic', icon } }];

  // 조사: 클로즈업을 연다. grant 가 있으면 첫 클릭에 증거를 조용히 등록한다.
  function inspect(id, label, icon, box, o) {
    const r = [], lk = lockRule(o), v = [{ view: o.view }];
    if (lk) r.push(lk);
    if (o.grant) {
      r.push({ if: [{ has: o.grant }], do: v });
      r.push({ if: [{ ended: true }], do: quiet(o.view) });
      r.push({ do: [...v, { grant: o.grant }] });
    } else r.push({ do: v });
    return hs('inspect', id, label, icon, box, r, { temp: o.temp !== false, showIf: o.showIf });
  }

  // 퍼즐: 풀고 나면 view(풀린 모습)를 클로즈업으로 다시 볼 수 있다.
  function puzzle(id, label, icon, box, pid, o = {}) {
    const r = [], lk = lockRule(o);
    if (lk) r.push(lk);
    r.push({ if: [{ solved: pid }], do: [{ view: EF.PUZZLES[pid].view }] });
    r.push({ if: [{ ended: true }], do: quiet(null, icon) });
    r.push({ do: [{ puzzle: pid }] });
    return hs('puzzle', id, label, icon, box, r, { temp: o.temp !== false, showIf: o.showIf });
  }

  const npc = (id, label, icon, box, npcId, o = {}) =>
    hs('npc', id, label, icon, box, o.rules || [{ do: [{ say: npcId }] }], { temp: !!o.temp });

  const move = (id, label, icon, box, to, o = {}) =>
    hs('move', id, label, icon, box, o.rules || [{ do: [{ go: to }] }], { temp: !!o.temp, showIf: o.showIf });

    ['R-04', 'R-05', 'R-06'],
    ['R-07', 'R-08', 'R-09', 'R-10'],
    ['R-11', 'R-12', 'R-13']
  ];
  const create = () => ({ scene: 'WORLD_MAP', evidence: {}, solved: {}, flags: {}, deduced: {}, fails: {}, order: 0 });
  EF.state = create();
  EF.reset = () => { EF.state = create(); };
  EF.getStage = (s = EF.state) => 1 + EF.TIERS.filter(t => t.every(id => s.evidence[id])).length;
  EF.isEnded = () => EF.getStage() === 5;
  EF.traceCount = () => Object.keys(EF.state.evidence).filter(id => EF.EVIDENCE[id].type === 'trace').length;
})();

<script>
/* 조건 평가. 배열은 AND. 지원: stageMin stageMax has solved flag deduced ended notEnded not any all */
(function () {
  const EF = window.EF;
  EF.check = function check(cond, s = EF.state) {
    if (cond === undefined || cond === null) return true;
    if (Array.isArray(cond)) return cond.every(c => check(c, s));
    return Object.keys(cond).every(k => {
      const v = cond[k];
      switch (k) {
        case 'stageMin': return EF.getStage(s) >= v;
        case 'stageMax': return EF.getStage(s) <= v;
        case 'has': return !!s.evidence[v];
        case 'solved': return !!s.solved[v];
        case 'flag': return !!s.flags[v];
        case 'deduced': return !!s.deduced[v];
        case 'ended': return EF.getStage(s) === 5;
        case 'notEnded': return EF.getStage(s) !== 5;
        case 'not': return !check(v, s);
        case 'any': return v.some(c => check(c, s));
        case 'all': return v.every(c => check(c, s));
        default: console.warn('알 수 없는 조건', k); return false;
      }
    });
  };
})();

</script>
<script>
/* 규칙 엔진. 화면과 무관하게 state 를 바꾸고, 보여줄 것은 queue 로 돌려준다.
   action: go view shake text say toast grant puzzle flag deduce
   view: 클로즈업 열기(views.js 의 ID 또는 즉석 객체) / shake: 상호작용 불가 → 화면만 흔들림
   5단계(엔딩) 이후에는 grant puzzle flag deduce 가 차단된다. */
(function () {
  const EF = window.EF;
  const BLOCKED = ['grant', 'puzzle', 'flag', 'deduce'];

  EF.exec = function (actions, q) {
    const s = EF.state;
    let blocked = false;
    for (const a of actions) {
      const key = Object.keys(a)[0];
      if (EF.isEnded() && BLOCKED.includes(key)) { blocked = true; continue; }
      switch (key) {
        case 'go': s.scene = a.go; break;
        case 'view': q.push({ t: 'view', view: a.view }); break;
        case 'shake': q.push({ t: 'shake' }); break;
        case 'text': q.push({ t: 'text', text: a.text, note: a.note, who: a.who }); break;
        case 'say': q.push({ t: 'say', npc: a.say, ctx: a.ctx }); break;
        case 'toast': q.push({ t: 'toast', text: a.toast }); break;
        case 'grant':
          if (!s.evidence[a.grant]) {
            s.evidence[a.grant] = ++s.order;
            if (EF.CONFIG.showMemo) q.push({ t: 'toast', kind: 'gain', text: '📓 증거 등록 · ' + EF.EVIDENCE[a.grant].name });
          }
          break;
        case 'puzzle': q.push({ t: 'puzzle', id: a.puzzle }); break;
        case 'flag': s.flags[a.flag] = true; break;
        case 'deduce':
          if (!s.deduced[a.deduce]) {
            s.deduced[a.deduce] = true;
            const d = EF.DEDUCTIONS.find(x => x.id === a.deduce);
            if (EF.CONFIG.showMemo) q.push({ t: 'toast', kind: 'gain', text: '🧩 추리 기록 · ' + d.title });
          }
          break;
        default: console.warn('알 수 없는 액션', key);
      }
    }
    if (blocked) q.push({ t: 'toast', text: EF.TEXT.endedBlocked });
    if (!EF.CONFIG.showMemo) EF.autoDeduce();
  };

  // 메모를 숨긴 모드: 필요한 증거가 모두 모이면 추리를 사이트가 조용히 완료한다.
  // MAIN/선택 추리는 증거 조건, FINAL-01 은 MAIN 3개 + 4단계. 5단계(엔딩) 이후에는 새로 만들지 않는다.
  EF.autoDeduce = function () {
    if (EF.isEnded()) return;
    const s = EF.state;
    EF.DEDUCTIONS.forEach(d => {
      if (d.kind === 'final' || s.deduced[d.id]) return;
      if (d.requires.every(id => s.evidence[id])) s.deduced[d.id] = true;
    });
    if (!s.deduced['FINAL-01'] && EF.finalStatus().ready) s.deduced['FINAL-01'] = true;
  };

  // 단계가 올랐으면 알림(+엔딩)을 queue 끝에 붙인다
  EF.afterStage = function (before, q) {
    const now = EF.getStage();
    if (now > before) {
      q.push({ t: 'stage', stage: now });
      if (now === 5) q.push({ t: 'ending' });
    }
  };

  // 핫스팟 클릭: 첫 번째로 통과하는 규칙 실행
  EF.click = function (hotspot) {
    const q = [], before = EF.getStage();
    const rule = hotspot.rules.find(r => EF.check(r.if));
    if (rule) EF.exec(rule.do, q);
    EF.afterStage(before, q);
    return q;
  };

  EF.solvePuzzle = function (pid) {
    const q = [], before = EF.getStage(), p = EF.PUZZLES[pid];
    EF.state.solved[pid] = true;
    if (p.success) q.push(p.view ? { t: 'view', view: p.view } : { t: 'text', text: p.success });
    EF.exec(p.onSolve || [], q);
    EF.afterStage(before, q);
    return q;
  };

  // 추리 연결: picks 가 requires 와 같은 집합이면 성공
  EF.tryDeduce = function (id, picks) {
    const d = EF.DEDUCTIONS.find(x => x.id === id), q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    const ok = d.requires.length === picks.length && d.requires.every(r => picks.includes(r));
    if (ok) EF.exec([{ deduce: id }], q);
    return { ok, q };
  };

  EF.finalStatus = function () {
    const mains = EF.DEDUCTIONS.filter(d => d.kind === 'main' && EF.state.deduced[d.id]).length;
    return { mains, stageOk: EF.getStage() >= 4, ready: mains === 3 && EF.getStage() >= 4 };
  };
  EF.tryFinal = function () {
    const q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    if (!EF.finalStatus().ready) return { ok: false, q };
    EF.exec([{ deduce: 'FINAL-01' }], q);
    return { ok: true, q };
  };

  EF.npcLine = function (npcId) {
    const n = EF.NPCS[npcId];
    const l = (n.lines || []).find(x => EF.check(x.if));
    return l ? l.text : EF.TEXT.npcPlaceholder;
  };
})();

</script>

<script>
/* 화면(View): 옛날 홈페이지 같은 사이트 틀(머리말·본문·푸터) 안에 장면 그림(1280x720)을 넣어 그린다.
   - 마을/장소 이동은 그림 창 안의 클릭 요소로만 한다(메뉴·경로 링크 없음).
   - 뒤로가기: 그림 아래쪽 가장자리에 마우스를 대면 커서가 아래 화살표로 바뀌고, 클릭하면 한 단계 나간다.
   - 주소(#장소ID)와 브라우저 뒤로가기도 동작한다. */
(function () {
  const EF = window.EF;

  const h = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  EF.h = h;
  const UI = (EF.UI = { busy: false, hints: false, dismiss: null, visited: {} });
  let stage, wrap, sceneEl, wm, hsEl, ptitle, pintro, tagline, counter, backEl, memoBtn, nbCount, firstRender = true;

  UI.init = function () {
    stage = UI.stage = $('stage'); wrap = $('stagewrap');
    ptitle = $('ptitle'); pintro = $('pintro'); tagline = $('tagline'); counter = $('counter');
    stage.innerHTML = '';
    sceneEl = h('div', 'scene'); wm = h('div', 'wm'); sceneEl.append(wm);
    hsEl = h('div', 'hotspots');
    UI.toastEl = h('div', 'toasts');
    UI.bannerEl = h('div', 'banner');
    backEl = h('div', 'edge-back'); backEl.onclick = () => UI.goBack();
    backEl.append(h('div', 'edge-arrow')); // 뒤로 갈 수 있다는 표시(항상 희미하게 보이고, 마우스를 대면 진해짐)
    stage.append(sceneEl, h('div', 'fx'), hsEl, backEl, UI.toastEl, UI.bannerEl);
    // 메모 버튼은 설정(showMemo)을 켰을 때만 만든다
    if (EF.CONFIG.showMemo) {
      memoBtn = h('button', 'memo-btn', '📓 메모 ('); nbCount = h('b', '', '0'); memoBtn.append(nbCount, ')');
      memoBtn.onclick = () => UI.openNotebook();
      stage.append(memoBtn);
    }
    EF.Debug.init(stage);

    $('hintLink').onclick = e => {
      e.preventDefault(); UI.hints = !UI.hints; stage.classList.toggle('hints', UI.hints);
      e.target.textContent = UI.hints ? '클릭할 수 있는 곳 표시 끄기' : '클릭할 수 있는 곳 표시하기';
    };
    if (/[?&]dev\b/.test(location.search)) {
      const d = h('a', 'devlink', 'DEV'); d.href = '#'; d.onclick = e => { e.preventDefault(); EF.Debug.toggle(); };
      $('devSlot').append(d);
    }

    addEventListener('resize', UI.fit);
    addEventListener('keydown', e => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') { EF.Debug.toggle(); return; }
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        // 퍼즐 창(dismissEscOnly)은 Esc 로만 닫힌다
        if (UI.dismiss && (e.key === 'Escape' || !UI.dismissEscOnly)) { e.preventDefault(); UI.dismiss(); }
      } else if (EF.CONFIG.showMemo && (e.key === 'n' || e.key === 'N') && !UI.busy) UI.openNotebook();
    });
    // 브라우저 뒤로/앞으로: 이미 방문한 페이지로만 이동 허용(주소창으로 잠긴 곳 우회 방지)
    addEventListener('popstate', () => {
      const id = location.hash.slice(1);
      if (UI.busy || !EF.SCENES[id] || !UI.visited[id]) { history.replaceState(null, '', '#' + EF.state.scene); return; }
      if (id !== EF.state.scene) { EF.state.scene = id; UI.render(true); }
    });

    UI.fit();
  };

  UI.fit = function () {

  };

  // 뒤로: 한 단계 위 장면(장소 → 마을 지도 → 월드맵)으로
  UI.goBack = function () {
    if (UI.busy) return;
    const sc = EF.SCENES[EF.state.scene];
    if (sc.parent) { EF.state.scene = sc.parent; UI.render(); }
  };

  UI.render = function (fromHistory) {
    const st = EF.state, sc = EF.SCENES[st.scene], stg = EF.getStage();
    UI.visited[sc.id] = true;
    if (!fromHistory && location.hash !== '#' + sc.id) {
      if (firstRender) history.replaceState(null, '', '#' + sc.id); else history.pushState(null, '', '#' + sc.id);
    }
    firstRender = false;
    document.title = `${sc.name} · EVERFREEZE`;
    stage.dataset.stage = stg; document.body.dataset.stage = stg;
    const img = EF.BG_IMAGES.includes(sc.id) ? `url(assets/bg/${sc.id}.png) center/cover no-repeat, ` : '';

    counter.textContent = EF.TEXT.site.counter[stg];
    if (nbCount) nbCount.textContent = Object.keys(st.evidence).length;
    ptitle.textContent = sc.name;
    pintro.textContent = sc.intro || (sc.kind === 'world' ? EF.TEXT.site.worldIntro : EF.TEXT.site.mapIntro);
    backEl.style.display = sc.parent ? '' : 'none';

    // 핫스팟
    hsEl.innerHTML = '';
    sc.hotspots.forEach(hp => {
      if (!EF.check(hp.showIf)) return;
      const b = h('button', `hs hs-${hp.kind}` + (hp.temp ? ' temp' : ''));
      b.style.cssText = `left:${hp.x}px;top:${hp.y}px;width:${hp.w}px;height:${hp.h}px`;
      b.dataset.id = hp.id;
      b.append(h('span', 'ico', hp.icon), h('span', 'lbl', hp.label));
      b.onclick = () => { if (UI.busy) return; UI.run(EF.click(hp)); };
      hsEl.append(b);
    });
  };

  // 아직 상호작용할 수 없는 것을 눌렀을 때: 글 없이 그림만 살짝 흔들린다
  UI.shake = function () {
    stage.classList.remove('nudge'); void stage.offsetWidth; stage.classList.add('nudge');
    clearTimeout(UI._nudgeT); UI._nudgeT = setTimeout(() => stage.classList.remove('nudge'), 450);
  };

  UI.toast = function (text, kind) {
    const t = h('div', 'toast' + (kind ? ' ' + kind : ''), text);
    UI.toastEl.append(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3200);
  };

  // 단계가 오르면 숫자 대신 짧은 위화감 문구만 보여 준다
  UI.banner = function () {
    UI.bannerEl.innerHTML = '';
    UI.bannerEl.append(h('b', '', EF.TEXT.site.stageNotice));
    UI.bannerEl.classList.remove('show'); void UI.bannerEl.offsetWidth; UI.bannerEl.classList.add('show');
  };
})();

</script>
<script>
/* 퍼즐 유형별 화면. overlays.js 의 퍼즐 창이 EF.PZ[type](p, area, api) 를 부른다.
   api.ready(bool)  : '확인' 버튼을 켜고 끈다
   api.clear()      : 오답 문구를 지운다
   돌려주는 함수     : 지금 화면 상태가 정답이면 true
   유형: pick order code dial clock lever rings slide cipher signal glass */
(function () {
  const EF = window.EF, h = EF.h;
  const PZ = (EF.PZ = {});

  // ---------- 하나 고르기 ----------
  PZ.pick = function (p, area, api) {
    let sel = -1;
    const list = h('div', 'pz-list');
    p.options.forEach((o, i) => {
      const b = h('button', 'opt', o);
      b.onclick = () => { sel = i; [...list.children].forEach((c, j) => c.classList.toggle('on', j === i)); api.ready(true); api.clear(); };
      list.append(b);
    });
    area.append(list);
    return () => sel === p.answer;
  };

  // ---------- 순서대로 누르기 (items 는 정답 순서, shuffle 은 화면 배치) ----------
  PZ.order = function (p, area, api) {
    let seq = [];
    const seqEl = h('div', 'seq'), pool = h('div', 'pool');
    const draw = () => {
      seqEl.innerHTML = ''; pool.innerHTML = '';
      p.items.forEach((_, i) => {
        const slot = h('div', 'slot', seq[i] !== undefined ? p.items[seq[i]] : String(i + 1));
        if (seq[i] !== undefined) slot.classList.add('filled');
        seqEl.append(slot);
      });
      p.shuffle.forEach(idx => {
        const b = h('button', 'opt', p.items[idx]); b.disabled = seq.includes(idx);
        b.onclick = () => { seq.push(idx); api.clear(); draw(); };
        pool.append(b);
      });
      const reset = h('button', 'btn small', '처음부터'); reset.onclick = () => { seq = []; api.clear(); draw(); };
      pool.append(reset);
      api.ready(seq.length === p.items.length);
    };
    area.append(seqEl, pool); draw();
    return () => seq.every((v, i) => v === i);
  };

  // ---------- 숫자 입력 ----------
  function codeInput(p, api) {
    const inp = h('input', 'code'); inp.maxLength = p.digits || 4; inp.inputMode = 'numeric'; inp.placeholder = '숫자';
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); api.ready(inp.value.length === (p.digits || inp.value.length)); api.clear(); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') api.submit(); else if (e.key === 'Escape') api.close(); };
    setTimeout(() => inp.focus(), 30);
    return inp;
  }
  PZ.code = function (p, area, api) {
    const inp = codeInput(p, api); area.append(inp);
    return () => inp.value === p.answer;
  };

  // ---------- 다이얼 / 회전 링 (숫자 칸을 ▲▼ 로 돌린다) ----------
  function wheels(p, area, api, cls) {
    const vals = Array(p.digits).fill(0), row = h('div', 'wheels ' + cls);
    for (let i = 0; i < p.digits; i++) {
      const w = h('div', 'wheel'), num = h('div', 'wnum', '0');
      const up = h('button', 'wbtn', '▲'), dn = h('button', 'wbtn', '▼');
      const set = d => { vals[i] = (vals[i] + d + 10) % 10; num.textContent = vals[i]; w.style.setProperty('--rot', vals[i] * 36 + 'deg'); api.clear(); };
      up.onclick = () => set(1); dn.onclick = () => set(-1);
      num.onwheel = e => { e.preventDefault(); set(e.deltaY < 0 ? 1 : -1); };
      w.append(up, num, dn);
      if (p.labels) w.append(h('div', 'wlabel', p.labels[i] || ' '));
      row.append(w);
    }
    area.append(row); api.ready(true);
    return () => vals.join('') === p.answer;
  }
  PZ.dial = (p, area, api) => wheels(p, area, api, 'dial');
  PZ.rings = (p, area, api) => wheels(p, area, api, 'rings');

  // ---------- 시계 맞추기 (시 1~12, 분 5분 단위) ----------
  PZ.clock = function (p, area, api) {
    let hr = 12, mn = 0;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('class', 'clockface');
    const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.append(e); return e; };
    el('circle', { cx: 100, cy: 100, r: 92, class: 'cf-rim' });
    for (let i = 1; i <= 12; i++) {
      const a = i * Math.PI / 6, t = el('text', { x: 100 + 74 * Math.sin(a), y: 100 - 74 * Math.cos(a) + 6, class: 'cf-num' });
      t.textContent = i;
    }
    const hh = el('line', { x1: 100, y1: 100, x2: 100, y2: 52, class: 'cf-h' });
    const mh = el('line', { x1: 100, y1: 100, x2: 100, y2: 28, class: 'cf-m' });
    el('circle', { cx: 100, cy: 100, r: 5, class: 'cf-pin' });
    const label = h('div', 'clock-label');
    const draw = () => {
      hh.setAttribute('transform', `rotate(${(hr % 12) * 30 + mn / 2} 100 100)`);
      mh.setAttribute('transform', `rotate(${mn * 6} 100 100)`);
      label.textContent = `${hr}시 ${String(mn).padStart(2, '0')}분`;
    };
    const btn = (t, f) => { const b = h('button', 'btn small', t); b.onclick = () => { f(); draw(); api.clear(); }; return b; };
    const ctl = h('div', 'clock-ctl');
    ctl.append(
      h('span', 'cl-t', '시'), btn('◀', () => (hr = hr === 1 ? 12 : hr - 1)), btn('▶', () => (hr = hr === 12 ? 1 : hr + 1)),
      h('span', 'cl-t', '분'), btn('◀', () => (mn = (mn + 55) % 60)), btn('▶', () => (mn = (mn + 5) % 60)));
    const box = h('div', 'clockbox'); box.append(svg, h('div', 'clock-side'));
    box.lastChild.append(label, ctl);
    area.append(box); draw(); api.ready(true);
    return () => hr === p.answer.h && mn === p.answer.m;
  };

  // ---------- 레버 순서 ----------
  PZ.lever = function (p, area, api) {
    let seq = [];
    const byKey = Object.fromEntries(p.levers.map(l => [l.key, l]));
    const row = h('div', 'levers'), trail = h('div', 'lever-trail');
    const draw = () => {
      row.innerHTML = ''; trail.innerHTML = '';
      p.display.forEach(k => {
        const l = byKey[k], b = h('button', 'lever' + (seq.includes(k) ? ' down' : ''));
        b.style.setProperty('--c', l.color);
        b.append(h('span', 'knob'), h('span', 'stick'), h('span', 'lname', l.name));
        b.disabled = seq.includes(k);
        b.onclick = () => { seq.push(k); api.clear(); draw(); };
        row.append(b);
      });
      p.levers.forEach((_, i) => {
        const k = seq[i], d = h('span', 'dot', k ? byKey[k].name : String(i + 1));
        if (k) { d.classList.add('on'); d.style.background = byKey[k].color; }
        trail.append(d);
      });
      api.ready(seq.length === p.levers.length);
    };
    const reset = h('button', 'btn small', '레버 되돌리기'); reset.onclick = () => { seq = []; api.clear(); draw(); };
    const foot = h('div', 'row center'); foot.append(trail, reset);
    area.append(row, foot); draw();
    return () => seq.every((k, i) => k === p.answer[i]);
  };

  // ---------- 슬라이드 3×3 (같은 그림 조각끼리는 바꿔도 같음, 줄마다 그림이 맞으면 정답) ----------
  PZ.slide = function (p, area, api) {
    // 정답 배치: 줄 r 에 rows[r] 조각 3개, 마지막 칸은 빈칸(null)
    let cells = [];
    p.rows.forEach((rw, r) => { for (let c = 0; c < 3; c++) cells.push(r === 2 && c === 2 ? null : r); });
    const solved = () => cells.every((v, i) => (i === 8 ? v === null : v === Math.floor(i / 3)));
    const nb = i => [i - 3, i + 3, i % 3 ? i - 1 : -1, i % 3 < 2 ? i + 1 : -1].filter(j => j >= 0 && j < 9);
    const swap = i => { const e = cells.indexOf(null); [cells[e], cells[i]] = [cells[i], cells[e]]; };
    // 정답에서 무작위로 밀어 섞는다(항상 풀 수 있음). 같은 상태면 다시 섞는다.
    do {
      let prev = -1;
      for (let k = 0; k < (p.scramble || 60); k++) {
        const opts = nb(cells.indexOf(null)).filter(j => j !== prev);
        const j = opts[Math.floor(Math.random() * opts.length)];
        prev = cells.indexOf(null); swap(j);
      }
    } while (solved());
    const grid = h('div', 'slidegrid');
    const draw = () => {
      grid.innerHTML = '';
      cells.forEach((v, i) => {
        const t = h('button', v === null ? 'stile empty' : 'stile', v === null ? '' : p.rows[v].icon);
        if (v !== null) t.title = p.rows[v].name;
        const movable = v !== null && nb(i).includes(cells.indexOf(null));
        t.classList.toggle('movable', movable);
        t.onclick = () => { if (movable) { swap(i); api.clear(); draw(); } };
        grid.append(t);
      });
    };
    area.append(grid); draw(); api.ready(true);
    return solved;
  };

  // ---------- 암호 해독 (기호 → 숫자) ----------
  PZ.cipher = function (p, area, api) {
    const sym = h('div', 'cipher-syms');
    p.symbols.forEach(s => sym.append(h('span', 'csym', s)));
    const legend = h('div', 'cipher-legend');
    p.legend.forEach(s => legend.append(h('span', '', `${s} = ?`)));
    const inp = codeInput(p, api);
    area.append(sym, legend, inp);
    return () => inp.value === p.answer;
  };

  // ---------- 등대 신호 (같은 신호를 여러 번 쓸 수 있음) ----------
  PZ.signal = function (p, area, api) {
    let seq = [];
    const byKey = Object.fromEntries(p.signals.map(s => [s.key, s]));
    const slots = h('div', 'seq'), pad = h('div', 'sigpad');
    const draw = () => {
      slots.innerHTML = '';
      p.answer.forEach((_, i) => {
        const k = seq[i], s = h('div', 'slot' + (k ? ' filled' : ''), k ? `${byKey[k].icon} ${byKey[k].name}` : String(i + 1));
        slots.append(s);
      });
      [...pad.querySelectorAll('.sig')].forEach(b => (b.disabled = seq.length >= p.answer.length));
      api.ready(seq.length === p.answer.length);
    };
    p.signals.forEach(s => {
      const b = h('button', 'sig'); b.append(h('span', 'ico', s.icon), h('span', '', s.name));
      b.onclick = () => { seq.push(s.key); api.clear(); draw(); };
      pad.append(b);
    });
    const undo = h('button', 'btn small', '하나 지우기'); undo.onclick = () => { seq.pop(); api.clear(); draw(); };
    const reset = h('button', 'btn small', '처음부터'); reset.onclick = () => { seq = []; api.clear(); draw(); };
    pad.append(undo, reset);
    area.append(slots, pad); draw();
    return () => seq.length === p.answer.length && seq.every((k, i) => k === p.answer[i]);
  };

  // ---------- 유리 조각 2×2 (칸 0 왼위 → 1 오위 → 2 오아래 → 3 왼아래) ----------
  PZ.glass = function (p, area, api) {
    const cells = p.start.map(x => ({ p: x.p, r: x.r }));
    const POS = [0, 1, 3, 2]; // 칸 번호 → 2×2 그리드에서의 위치(행 우선)
    let sel = -1;
    const grid = h('div', 'glassgrid');
    const draw = () => {
      grid.innerHTML = '';
      const order = [];
      cells.forEach((c, i) => (order[POS[i]] = i));
      order.forEach(i => {
        const c = cells[i], pc = p.pieces[c.p];
        const cell = h('div', 'gcell' + (sel === i ? ' sel' : ''));
        const piece = h('button', 'gpiece');
        piece.style.background = pc.color;
        piece.style.transform = `rotate(${c.r * 90}deg)`;
        piece.append(h('span', 'gtri', '▲'), h('span', 'gname', pc.name));
        piece.onclick = () => {
          api.clear();
          if (sel === -1) sel = i;
          else if (sel === i) sel = -1;
          else { [cells[sel], cells[i]] = [cells[i], cells[sel]]; sel = -1; }
          draw();
        };
        const rot = h('button', 'grot', '⟳'); rot.title = '돌리기';
        rot.onclick = () => { c.r = (c.r + 1) % 4; api.clear(); draw(); };
        cell.append(piece, rot); grid.append(cell);
      });
    };
    area.append(grid); draw(); api.ready(true);
    return () => cells.every((c, i) => c.p === i && c.r === 0);
  };
})();

</script>
<script>
/* 오버레이: 조사 텍스트(INSPECT) · 대화(DIALOGUE) · 퍼즐(PUZZLE) · 엔딩, 그리고 큐 처리. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  function scrim() { const s = h('div', 'scrim'); UI.stage.append(s); return s; }
  function closeWith(node, done) {
    node.remove(); UI.dismiss = null; done();
  }

  UI.showText = function (it, done) {
    const sc = scrim(), box = h('div', 'textbox');
    if (it.who) box.append(h('div', 'who', it.who));
    box.append(h('div', 'body', it.text));
    if (it.note && EF.CONFIG.showMemo) box.append(h('div', 'note', '✔ ' + it.note));
    box.append(h('div', 'next', '▼ 클릭'));
    sc.append(box);
    const close = () => closeWith(sc, done);
    sc.onclick = close; UI.dismiss = close;
  };

  UI.showSay = function (it, done) {
    const n = EF.NPCS[it.npc], sc = scrim(), box = h('div', 'textbox dialogue');
    const por = h('div', 'portrait', n.name[0]); por.style.background = n.color;
    const head = h('div', 'dhead');
    head.append(h('b', '', n.name), h('span', 'role', n.role));
    if (it.ctx) head.append(h('span', 'ctx', it.ctx));
    const body = h('div', 'body', EF.npcLine(it.npc));
    const btn = h('button', 'btn close', '닫기');
    const col = h('div', 'dcol'); col.append(head, body);
    box.append(por, col, btn);
    sc.append(box);
    const close = () => closeWith(sc, done);
    btn.onclick = e => { e.stopPropagation(); close(); };
    sc.onclick = e => { if (e.target === sc) close(); };
    UI.dismiss = close;
  };

  UI.showEnding = function (done) {
    const sc = scrim(); sc.classList.add('dim');
    const card = h('div', 'ending');
    card.append(h('h2', '', EF.TEXT.ending.title));
    EF.TEXT.ending.body.split('\n').forEach(l => card.append(h('p', '', l || ' ')));
    const b = h('button', 'btn primary', EF.TEXT.ending.btn);
    card.append(b); sc.append(card);
    const close = () => closeWith(sc, done);
    b.onclick = close; UI.dismiss = close;
  };

  // ---------- 퍼즐 ----------
  // 유형별 화면은 pz.js(EF.PZ). 건너뛰기 없음 · 닫아도 미해결 유지 · 오답 EF.HINT_AFTER(3)회부터 힌트.
  // 퍼즐 창은 Esc(또는 닫기 버튼)로만 닫힌다. Enter/Space 로는 닫히지 않는다.
  UI.showPuzzle = function (pid, done) {
    const p = EF.PUZZLES[pid], sc = scrim(); sc.classList.add('dim');
    const card = h('div', 'puzzle pz-' + p.type);
    const head = h('div', 'phead');
    head.append(h('h3', '', p.title));
    if (p.level) head.append(h('span', 'plevel', p.level));
    card.append(head, h('p', 'prompt', p.prompt));
    const area = h('div', 'parea');
    const msg = h('div', 'pmsg', '');
    const hint = h('div', 'phint');
    const actions = h('div', 'pactions');
    const cancel = h('button', 'btn', '닫기 (Esc)');
    const okBtn = h('button', 'btn primary', '확인'); okBtn.disabled = true;
    actions.append(cancel, okBtn);
    card.append(area, msg, hint, actions); sc.append(card);

    const fails = () => EF.state.fails[pid] || 0;
    const showHint = () => {
      if (fails() >= EF.HINT_AFTER && p.hint) { hint.textContent = '힌트 · ' + p.hint; hint.classList.add('on'); }
    };
    const close = solved => {
      sc.remove(); UI.dismiss = null; UI.dismissEscOnly = false;
      done(solved ? EF.solvePuzzle(pid) : []);
    };
    let isOk = () => false;
    const submit = () => {
      if (okBtn.disabled) return;
      if (isOk()) { close(true); return; }
      EF.state.fails[pid] = fails() + 1;
      msg.textContent = p.fail;
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      showHint();
    };
    const api = {
      ready: on => { okBtn.disabled = !on; },
      clear: () => { msg.textContent = ''; },
      submit,
      close: () => close(false)
    };
    const make = EF.PZ[p.type];
    if (make) isOk = make(p, area, api);
    else console.warn('알 수 없는 퍼즐 유형', p.type);
    showHint(); // 이미 3번 틀린 퍼즐은 다시 열어도 힌트가 보인다

    okBtn.onclick = submit;
    cancel.onclick = () => close(false);
    UI.dismiss = () => close(false);
    UI.dismissEscOnly = true;
  };

  // ---------- 큐 처리 ----------
  UI.run = function (queue) {
    UI.busy = true;
    UI.render();
    const next = () => {
      const it = queue.shift();
      if (!it) { UI.busy = false; UI.render(); return; }
      switch (it.t) {
        case 'toast': UI.toast(it.text, it.kind); UI.render(); next(); break;
        case 'text': UI.showText(it, next); break;
        case 'view': UI.showView(it, next); break;
        case 'shake': UI.shake(); next(); break;
        case 'say': UI.showSay(it, next); break;
        case 'puzzle': UI.showPuzzle(it.id, q => { queue.unshift(...q); next(); }); break;
        case 'stage': UI.render(); UI.banner(it.stage); next(); break;
        case 'ending': UI.render(); UI.showEnding(next); break;
        default: next();
      }
    };
    next();
  };
})();

</script>
<script>
/* 클로즈업 장면. 조사 요소를 누르면 그림 창 전체가 그 물건을 가까이 본 장면으로 바뀐다.
   글로 설명하지 않는다(제목·설명 문장 없음). 힌트는 그림 속 사물로만 보인다.
   돌아가기: 장면과 똑같이 그림 하단(▼ 띠)을 클릭. 키보드는 Esc.
   그림 데이터는 src/data/views.js. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (svg, tag, at, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in at) e.setAttribute(k, at[k]);
    if (text !== undefined) e.textContent = text;
    svg.append(e); return e;
  };
  const newSvg = (w, hh) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${hh}`); return s; };
  const R = {}; // kind 별 그리기

  R.pic = (v, id) => {
    const box = h('div', 'cv-pic');
    if (id && EF.VIEW_IMAGES.includes(id)) {
      box.style.backgroundImage = `url(assets/view/${id}.png)`;
      box.classList.add('has-img');
    } else {
      const [a, b] = v.tone || ['#e9e4dc', '#9c9284'];
      box.style.background = `radial-gradient(ellipse at 50% 45%, ${a} 0%, ${b} 100%)`;
      box.append(h('div', 'cv-icon', v.icon || '?'));
      if (id) box.append(h('div', 'cv-tag', `임시 그림 · assets/view/${id}.png`));
    }
    return box;
  };

  R.doc = v => {
    const box = h('div', 'cv-doc paper-' + (v.paper || 'note') + (v.blur ? ' blur' : ''));
    const sheet = h('div', 'd-sheet');
    if (v.head) sheet.append(h('div', 'd-head', v.head));
    if (v.cols || v.rows.some(Array.isArray)) {
      const t = h('table', 'd-table');
      if (v.cols) { const tr = h('tr'); v.cols.forEach(c => tr.append(h('th', '', c))); t.append(tr); }
      v.rows.forEach(r => { const tr = h('tr'); [].concat(r).forEach(c => tr.append(h('td', '', c))); t.append(tr); });
      sheet.append(t);
    } else v.rows.forEach(r => sheet.append(h('p', 'd-line', r || ' ')));
    if (v.foot) sheet.append(h('div', 'd-foot', v.foot));
    box.append(sheet);
    return box;
  };

  R.strip = v => {
    const box = h('div', 'cv-strip');
    const sheet = h('div', 'st-sheet');
    v.items.forEach((icon, i) => { if (i) sheet.append(h('span', 'st-arrow', '→')); sheet.append(h('span', 'st-icon', icon)); });
    box.append(sheet);
    return box;
  };

  R.clock = v => {
    const box = h('div', 'cv-clock');
    const svg = newSvg(200, 200);
    svgEl(svg, 'circle', { cx: 100, cy: 100, r: 94, class: 'ck-rim' });
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, r1 = i % 5 ? 86 : 80;
      svgEl(svg, 'line', { x1: 100 + r1 * Math.sin(a), y1: 100 - r1 * Math.cos(a), x2: 100 + 90 * Math.sin(a), y2: 100 - 90 * Math.cos(a), class: i % 5 ? 'ck-tick' : 'ck-tick big' });
    }
    ['XII', 'III', 'VI', 'IX'].forEach((n, i) => {
      const a = i * Math.PI / 2;
      svgEl(svg, 'text', { x: 100 + 66 * Math.sin(a), y: 100 - 66 * Math.cos(a) + 7, class: 'ck-num' }, n);
    });
    // 시계 방향 표시(바늘은 늘 이 방향으로만 돈다)
    svgEl(svg, 'path', { d: 'M 128 30 A 76 76 0 0 1 170 72', class: 'ck-dir' });
    svgEl(svg, 'path', { d: 'M 170 72 l -9 -2 m 9 2 l 1 -9', class: 'ck-dir' });
    svgEl(svg, 'line', { x1: 100, y1: 100, x2: 100, y2: 50, class: 'ck-h', transform: `rotate(${(v.h % 12) * 30 + v.m / 2} 100 100)` });
    svgEl(svg, 'line', { x1: 100, y1: 108, x2: 100, y2: 22, class: 'ck-m', transform: `rotate(${v.m * 6} 100 100)` });
    svgEl(svg, 'circle', { cx: 100, cy: 100, r: 5, class: 'ck-pin' });
    box.append(svg);
    return box;
  };

  R.lights = v => {
    const box = h('div', 'cv-lights');
    const n = v.colors.length;
    v.colors.forEach((c, i) => {
      const b = h('div', 'bulb'); b.style.setProperty('--c', c);
      b.style.animationDelay = (i * 0.7) + 's'; b.style.animationDuration = (n * 0.7 + 1.2) + 's';
      box.append(b);
    });
    return box;
  };

  R.pattern = v => {
    const box = h('div', 'cv-pattern');
    v.rows.forEach(icon => { const r = h('div', 'p-row'); for (let i = 0; i < 3; i++) r.append(h('span', '', icon)); box.append(r); });
    return box;
  };

  R.steps = v => {
    const box = h('div', 'cv-steps');
    const row = h('div', 's-row');
    if (v.mark) row.append(h('div', 's-tag', v.mark));
    for (let i = 1; i <= v.total; i++) {
      const d = h('div', 's-dot' + (i < v.done ? ' done' : i === v.done ? ' stop' : ''), i <= v.done ? String(i) : '');
      if (i === v.done) d.append(h('span', 's-needle', '🪡'));
      row.append(d);
    }
    box.append(row);
    return box;
  };

  R.pins = v => {
    const box = h('div', 'cv-pins paper-' + (v.paper || 'cork'));
    v.items.forEach((it, i) => {
      const n = h('div', 'pin-note');
      if (it.icon) n.append(h('div', 'pn-icon', it.icon));
      if (it.text) n.append(h('div', 'pn-text', it.text));
      if (it.mark) n.append(h('div', 'pn-mark', it.mark));
      n.style.transform = `rotate(${[-3, 2, -1, 3, -2, 1, -4, 2, 0, -2][i % 10]}deg)`;
      box.append(n);
    });
    return box;
  };

  R.stack = v => {
    const box = h('div', 'cv-stack');
    for (let i = 0; i < v.count; i++) {
      const s = h('div', 'st-item');
      s.append(h('span', 'si-icon', v.icon));
      if (v.mark) s.append(h('span', 'si-mark', v.mark));
      s.style.transform = `translate(${(i - (v.count - 1) / 2) * 230}px, ${Math.abs(i - (v.count - 1) / 2) * 18}px) rotate(${(i - 1) * 5}deg)`;
      box.append(s);
    }
    return box;
  };

  // 「나이테 읽는 법」: 바깥 링부터 ①②③④, 시계는 긴 바늘(분) ① → 짧은 바늘(시) ②
  R.ringguide = () => {
    const box = h('div', 'cv-doc paper-book');
    const svg = newSvg(900, 420); svg.setAttribute('class', 'rg-svg');
    const rings = [175, 130, 85, 40];
    rings.forEach(r => svgEl(svg, 'circle', { cx: 230, cy: 210, r, class: 'rg-ring' }));
    // 번호는 오른쪽 아래 대각선 위에 바깥부터 1 2 3 4
    rings.forEach((r, i) => {
      const x = 230 + r * 0.707, y = 210 + r * 0.707;
      svgEl(svg, 'circle', { cx: x, cy: y, r: 17, class: 'rg-badge' });
      svgEl(svg, 'text', { x, y: y + 7, class: 'rg-num' }, String(i + 1));
    });
    // 바깥에서 안쪽으로 들어가는 화살표(왼쪽 위 대각선)
    svgEl(svg, 'path', { d: 'M 60 40 L 190 170', class: 'rg-arrow' });
    svgEl(svg, 'path', { d: 'M 172 170 L 192 172 L 190 152', class: 'rg-arrow' });
    // 시계: 긴 바늘 ① 먼저, 짧은 바늘 ② 나중
    svgEl(svg, 'circle', { cx: 660, cy: 210, r: 150, class: 'rg-clock' });
    svgEl(svg, 'line', { x1: 660, y1: 210, x2: 790, y2: 150, class: 'rg-long' });
    svgEl(svg, 'line', { x1: 660, y1: 210, x2: 600, y2: 290, class: 'rg-short' });
    svgEl(svg, 'circle', { cx: 660, cy: 210, r: 7, class: 'rg-pin' });
    svgEl(svg, 'circle', { cx: 800, cy: 122, r: 20, class: 'rg-badge' });
    svgEl(svg, 'text', { x: 800, y: 129, class: 'rg-num' }, '1');
    svgEl(svg, 'circle', { cx: 580, cy: 318, r: 20, class: 'rg-badge' });
    svgEl(svg, 'text', { x: 580, y: 325, class: 'rg-num' }, '2');
    box.append(svg);
    return box;
  };

  // it: { view: 'v-…' | {kind…} }
  UI.showView = function (it, done) {
    const id = typeof it.view === 'string' ? it.view : null;
    const v = id ? EF.VIEWS[id] : (it.view || { kind: 'pic' });
    if (!v) { console.warn('알 수 없는 클로즈업', it.view); done(); return; }

    const cu = h('div', 'closeup' + (EF.isEnded() ? ' quiet' : ''));
    cu.dataset.view = id || '';
    cu.append((R[v.kind] || R.pic)(v, id));
    // 돌아가기: 장면과 같은 하단 띠 + ▼
    const back = h('div', 'edge-back'); back.append(h('div', 'edge-arrow'));
    cu.append(back);
    UI.stage.append(cu);

    const close = () => { cu.remove(); UI.dismiss = null; UI.dismissEscOnly = false; done(); };
    back.onclick = e => { e.stopPropagation(); close(); };
    UI.dismiss = close; UI.dismissEscOnly = true; // 키보드는 Esc 만(Enter/Space 로는 안 닫힘)
  };
})();

</script>
<script>
/* 추리 수첩(NOTEBOOK): 증거 목록 + 필수/선택 추리. 슬롯에 증거를 채워 "연결"하면 가설이 기록된다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  UI.openNotebook = function () {
    if (UI.busy) return;
    UI.busy = true;
    const sc = h('div', 'scrim dim nbscrim'), panel = h('div', 'notebook');
    sc.append(panel); UI.stage.append(sc);
    let active = null, picks = [], detail = null, message = '';

    const close = () => { sc.remove(); UI.dismiss = null; UI.busy = false; UI.render(); };
    UI.dismiss = close;
    sc.onclick = e => { if (e.target === sc) close(); };

    function draw() {
      panel.innerHTML = '';
      const head = h('div', 'nb-head');
      head.append(h('h2', '', '📓 추리 수첩'));
      const x = h('button', 'btn', '닫기 (Esc)'); x.onclick = close; head.append(x);
      const cols = h('div', 'nb-cols');
      cols.append(drawEvidence(), drawDeductions());
      panel.append(head, cols);
    }

    function drawEvidence() {
      const left = h('div', 'nb-left');
      [['trace', '리셋 흔적'], ['clue', '단서'], ['opt', '선택 단서']].forEach(([type, title]) => {
        const own = Object.keys(EF.state.evidence).filter(id => EF.EVIDENCE[id].type === type)
          .sort((a, b) => EF.state.evidence[a] - EF.state.evidence[b]);
        left.append(h('h4', '', `${title} (${own.length})`));
        const list = h('div', 'evlist');
        if (!own.length) list.append(h('div', 'empty', '아직 없음'));
        own.forEach(id => {
          const e = EF.EVIDENCE[id];
          const b = h('button', 'ev' + (picks.includes(id) ? ' picked' : ''), `${id} · ${e.name}`);
          b.onclick = () => {
            detail = id; message = '';
            if (active && picks.length < active.requires.length && !picks.includes(id)) picks.push(id);
            draw();
          };
          list.append(b);
        });
        left.append(list);
      });
      const d = h('div', 'evdetail');
      if (detail) {
        const e = EF.EVIDENCE[detail];
        d.append(h('b', '', `${detail} · ${e.name}`), h('span', 'place', e.place), h('p', '', e.desc));
      } else d.append(h('p', 'empty', '증거를 누르면 설명이 보입니다. 추리 카드를 선택한 뒤 증거를 누르면 슬롯에 채워집니다.'));
      left.append(d);
      return left;
    }

    function drawDeductions() {
      const right = h('div', 'nb-right');
      [['main', '필수 추리'], ['final', '통합 추리'], ['opt', '선택 추리 (엔딩 조건과 무관)']].forEach(([kind, title]) => {
        right.append(h('h4', '', title));
        EF.DEDUCTIONS.filter(d => d.kind === kind).forEach(d => right.append(card(d)));
      });
      return right;
    }

    function card(d) {
      const solved = !!EF.state.deduced[d.id];
      const c = h('div', 'dcard' + (solved ? ' solved' : '') + (active === d ? ' active' : ''));
      const top = h('div', 'dtop');
      top.append(h('b', '', `${d.id} ${d.title}`), h('span', 'tag', solved ? '완료' : '미완료'));
      c.append(top);
      if (solved) { c.append(h('p', 'hypo', '가설: ' + d.hypo)); if (d.kind === 'final') c.append(h('p', 'sub', '(임시 안내) 아리아가 있는 도서관을 찾아가 보자.')); return c; }

      if (d.kind === 'final') {
        const st = EF.finalStatus();
        c.append(h('p', 'sub', `필수 추리 ${st.mains}/3 완료 · ${st.stageOk ? '4단계 이상 ✔' : '4단계 이상 필요'}`));
        const b = h('button', 'btn primary small', '통합 추리 기록'); b.disabled = !st.ready;
        b.onclick = () => { const r = EF.tryFinal(); r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind)); draw(); };
        c.append(b); return c;
      }
      if (active !== d) {
        c.append(h('p', 'sub', `연결할 증거 ${d.requires.length}개`));
        const b = h('button', 'btn small', '이 추리에 증거 연결'); b.onclick = () => { active = d; picks = []; message = ''; draw(); };
        c.append(b); return c;
      }
      const slots = h('div', 'slots');
      for (let i = 0; i < d.requires.length; i++) {
        const id = picks[i];
        const s = h('button', 'slot' + (id ? ' filled' : ''), id ? `${id} · ${EF.EVIDENCE[id].name}` : '비어 있음');
        s.onclick = () => { if (id) { picks.splice(i, 1); draw(); } };
        slots.append(s);
      }
      c.append(slots);
      if (message) c.append(h('p', 'msg', message));
      const row = h('div', 'row');
      const link = h('button', 'btn primary small', '연결하기'); link.disabled = picks.length !== d.requires.length;
      link.onclick = () => {
        const r = EF.tryDeduce(d.id, picks);
        r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind));
        if (r.ok) { active = null; picks = []; message = ''; } else { message = '서로 이어지지 않는다. 다른 증거를 골라 보자.'; picks = []; }
        draw();
      };
      const cancel = h('button', 'btn small', '취소'); cancel.onclick = () => { active = null; picks = []; message = ''; draw(); };
      row.append(link, cancel); c.append(row);
      return c;
    }
    draw();
  };
})();

</script>
<script>
/* 개발용 패널(DEV 버튼). 장면 이동 · 증거 지급 · 상태 확인 · 초기화. 최종 배포 때는 버튼만 숨기면 된다. */
(function () {
  const EF = window.EF, h = EF.h;
  let panel;
  EF.Debug = {
    init(stage) {
      panel = h('div', 'devpanel'); panel.style.display = 'none'; stage.append(panel);
    },
    toggle() {
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
      if (panel.style.display === '') this.draw();
    },
    draw() {
      panel.innerHTML = '';
      const st = EF.state;
      panel.append(h('b', '', `DEV · 단계 ${EF.getStage()} · 흔적 ${EF.traceCount()}/13`));
      const sel = h('select'); Object.values(EF.SCENES).forEach(s => { const o = h('option', '', `${s.id} ${s.name}`); o.value = s.id; if (s.id === st.scene) o.selected = true; sel.append(o); });
      sel.onchange = () => { st.scene = sel.value; EF.UI.render(); };
      panel.append(sel);
      const ev = h('div', 'devev');
      Object.keys(EF.EVIDENCE).forEach(id => {
        const b = h('button', st.evidence[id] ? 'on' : '', id);
        b.title = EF.EVIDENCE[id].name;
        b.onclick = () => { if (st.evidence[id]) delete st.evidence[id]; else st.evidence[id] = ++st.order; EF.UI.render(); this.draw(); };
        ev.append(b);
      });
      panel.append(ev);
      const flags = h('div', 'devflags', 'flags: ' + (Object.keys(st.flags).join(', ') || '-') + ' | 퍼즐: ' + (Object.keys(st.solved).join(', ') || '-') + ' | 추리: ' + (Object.keys(st.deduced).join(', ') || '-'));
      panel.append(flags);
      const row = h('div', 'row');
      const reset = h('button', '', '전체 초기화'); reset.onclick = () => { EF.reset(); EF.UI.shown = null; EF.UI.render(); this.draw(); };
      const close = h('button', '', '닫기'); close.onclick = () => this.toggle();
      row.append(reset, close); panel.append(row);
    }
  };
})();

</script>
<script>
/* 시작: 타이틀 없이 월드맵에서 바로 시작. */
document.addEventListener('DOMContentLoaded', () => window.EF.UI.init());

</script>

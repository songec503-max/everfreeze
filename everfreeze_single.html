<script>
/* 규칙 엔진. 화면과 무관하게 state 를 바꾸고, 보여줄 것은 queue 로 돌려준다.
   action: go view shake text say toast grant puzzle flag deduce
   view: 클로즈업 열기(views.js 의 ID 또는 즉석 객체) / shake: 상호작용 불가 → 화면만 흔들림
   5단계(엔딩) 이후에는 grant puzzle flag deduce 가 차단된다. */
(function () {
  const EF = window.EF;
  const BLOCKED = ['grant', 'puzzle', 'flag', 'deduce'];

  EF.exec = function (actions, q) {
    const s = EF.state;
    let blocked = false;
    for (const a of actions) {
      const key = Object.keys(a)[0];
      if (EF.isEnded() && BLOCKED.includes(key)) { blocked = true; continue; }
      switch (key) {
        case 'go': s.scene = a.go; break;
        case 'view': q.push({ t: 'view', view: a.view }); break;
        case 'shake': q.push({ t: 'shake' }); break;
        case 'text': q.push({ t: 'text', text: a.text, note: a.note, who: a.who }); break;
        case 'say':
          // 말하는 순간의 상태로 대사를 고른 뒤, 말 건 횟수를 늘린다(다음엔 '다시 말 걸 때' 대사)
          q.push({ t: 'say', npc: a.say, ctx: a.ctx, pages: EF.npcPages(a.say, a.ctx) });
          s.talks[a.say] = (s.talks[a.say] || 0) + 1;
          break;
        case 'toast': q.push({ t: 'toast', text: a.toast }); break;
        case 'hint': q.push({ t: 'hint', text: a.hint }); break; // 친절한 도움말 꼬리표
        case 'grant':
          if (!s.evidence[a.grant]) {
            s.evidence[a.grant] = ++s.order;
            if (EF.CONFIG.showMemo) q.push({ t: 'toast', kind: 'gain', text: '📓 증거 등록 · ' + EF.EVIDENCE[a.grant].name });
          }
          break;
        case 'puzzle': q.push({ t: 'puzzle', id: a.puzzle }); break;
        case 'flag': s.flags[a.flag] = true; break;
        case 'deduce':
          if (!s.deduced[a.deduce]) {
            s.deduced[a.deduce] = true;
            const d = EF.DEDUCTIONS.find(x => x.id === a.deduce);
            if (EF.CONFIG.showMemo) q.push({ t: 'toast', kind: 'gain', text: '🧩 추리 기록 · ' + d.title });
          }
          break;
        default: console.warn('알 수 없는 액션', key);
      }
    }
    if (blocked) q.push({ t: 'toast', text: EF.TEXT.endedBlocked });
    if (!EF.CONFIG.showMemo) EF.autoDeduce();
  };

  // 메모를 숨긴 모드: 필요한 증거가 모두 모이면 추리를 사이트가 조용히 완료한다.
  // MAIN/선택 추리는 증거 조건, FINAL-01 은 MAIN 3개 + 4단계. 5단계(엔딩) 이후에는 새로 만들지 않는다.
  EF.autoDeduce = function () {
    if (EF.isEnded()) return;
    const s = EF.state;
    EF.DEDUCTIONS.forEach(d => {
      if (d.kind === 'final' || s.deduced[d.id]) return;
      if (d.requires.every(id => s.evidence[id])) s.deduced[d.id] = true;
    });
    if (!s.deduced['FINAL-01'] && EF.finalStatus().ready) s.deduced['FINAL-01'] = true;
  };

  // 단계가 올랐으면 알림(+엔딩)을 queue 끝에 붙인다
  EF.afterStage = function (before, q) {
    const now = EF.getStage();
    if (now > before) {
      q.push({ t: 'stage', stage: now });
      if (now === 5) q.push({ t: 'ending' });
    }
  };

  // 핫스팟 클릭: 첫 번째로 통과하는 규칙 실행
  EF.click = function (hotspot) {
    const q = [], before = EF.getStage();
    const rule = hotspot.rules.find(r => EF.check(r.if));
    if (rule) EF.exec(rule.do, q);
    EF.afterStage(before, q);
    return q;
  };

  EF.solvePuzzle = function (pid) {
    const q = [], before = EF.getStage(), p = EF.PUZZLES[pid];
    EF.state.solved[pid] = true;
    if (p.success) q.push(p.view ? { t: 'view', view: p.view } : { t: 'text', text: p.success });
    EF.exec(p.onSolve || [], q);
    EF.afterStage(before, q);
    return q;
  };

  // 추리 연결: picks 가 requires 와 같은 집합이면 성공
  EF.tryDeduce = function (id, picks) {
    const d = EF.DEDUCTIONS.find(x => x.id === id), q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    const ok = d.requires.length === picks.length && d.requires.every(r => picks.includes(r));
    if (ok) EF.exec([{ deduce: id }], q);
    return { ok, q };
  };

  EF.finalStatus = function () {
    const mains = EF.DEDUCTIONS.filter(d => d.kind === 'main' && EF.state.deduced[d.id]).length;
    return { mains, stageOk: EF.getStage() >= 4, ready: mains === 3 && EF.getStage() >= 4 };
  };
  EF.tryFinal = function () {
    const q = [];
    if (EF.isEnded()) { q.push({ t: 'toast', text: EF.TEXT.endedBlocked }); return { ok: false, q }; }
    if (!EF.finalStatus().ready) return { ok: false, q };
    EF.exec([{ deduce: 'FINAL-01' }], q);
    return { ok: true, q };
  };

  // 대사 고르기: lines 를 위에서부터 검사해 처음 맞는 것. ctx 가 적힌 줄은 그 상황(출입 차단·대면 등)에서만.
  // text 는 문장 하나 또는 여러 장의 배열. 한 장은 '문장'(그 인물) / { clover: '문장' }(클로버) / { who: 인물ID, text }.
  EF.npcPages = function (npcId, ctx) {
    const n = EF.NPCS[npcId];
    const l = (n.lines || []).find(x => (!x.ctx || x.ctx === ctx) && EF.check(x.if));
    const raw = l ? [].concat(l.text) : [EF.TEXT.npcPlaceholder.replace('000', n.name)];
    return raw.map(p => typeof p === 'string' ? { who: npcId, text: p }
      : p.clover !== undefined ? { who: 'clover', text: p.clover } : { who: p.who || npcId, text: p.text });
  };
  EF.npcLine = (npcId, ctx) => EF.npcPages(npcId, ctx)[0].text;
})();

      }
      else if (ae && ae.box) b.classList.add('area'); // 배경 속 통로처럼 그림 없이 누르는 곳
      if (hp.npc && EF.NPCS[hp.npc]) { // 임시 그림일 때 인물은 색 동그라미 + 이름 첫 글자 (그림이 들어오면 숨겨진다)
        const n = EF.NPCS[hp.npc], ic = h('span', 'ico npc-ico', n.name[0]); ic.style.background = n.color; b.append(ic, h('span', 'lbl', hp.label));
      } else b.append(h('span', 'ico', hp.icon), h('span', 'lbl', hp.label));
      b.onclick = () => { if (UI.busy) return; UI.run(EF.click(hp)); };
      hsEl.append(b);
    });
  };

  // 아직 상호작용할 수 없는 것을 눌렀을 때: 글 없이 그림만 살짝 흔들린다
  UI.shake = function () {
    stage.classList.remove('nudge'); void stage.offsetWidth; stage.classList.add('nudge');
    clearTimeout(UI._nudgeT); UI._nudgeT = setTimeout(() => stage.classList.remove('nudge'), 450);
  };

  UI.toast = function (text, kind) {
    const t = h('div', 'toast' + (kind ? ' ' + kind : ''), text);
    UI.toastEl.append(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3200);
  };

  // 단계가 오르면 숫자 대신 짧은 위화감 문구만 보여 준다
  UI.banner = function () {
    UI.bannerEl.innerHTML = '';
    UI.bannerEl.append(h('b', '', EF.TEXT.site.stageNotice));
    UI.bannerEl.classList.remove('show'); void UI.bannerEl.offsetWidth; UI.bannerEl.classList.add('show');
  };
})();

</script>
<script>
/* 퍼즐 유형별 화면. overlays.js 의 퍼즐 창이 EF.PZ[type](p, area, api) 를 부른다.
   api.ready(bool)  : '확인' 버튼을 켜고 끈다
   api.clear()      : 오답 문구를 지운다
   돌려주는 함수     : 지금 화면 상태가 정답이면 true
   유형: pick order code dial clock lever rings slide cipher signal glass */
(function () {
  const EF = window.EF, h = EF.h;
  const PZ = (EF.PZ = {});

  // ---------- 하나 고르기 ----------
  PZ.pick = function (p, area, api) {
    let sel = -1;
    const list = h('div', 'pz-list');
    p.options.forEach((o, i) => {
      const b = h('button', 'opt', o);
      b.onclick = () => { sel = i; [...list.children].forEach((c, j) => c.classList.toggle('on', j === i)); api.ready(true); api.clear(); };
      list.append(b);
    });
    area.append(list);
    return () => sel === p.answer;
  };

  // ---------- 순서대로 누르기 (items 는 정답 순서, shuffle 은 화면 배치) ----------
  PZ.order = function (p, area, api) {
    let seq = [];
    const seqEl = h('div', 'seq'), pool = h('div', 'pool');
    const draw = () => {
      seqEl.innerHTML = ''; pool.innerHTML = '';
      p.items.forEach((_, i) => {
        const slot = h('div', 'slot', seq[i] !== undefined ? p.items[seq[i]] : String(i + 1));
        if (seq[i] !== undefined) slot.classList.add('filled');
        seqEl.append(slot);
      });
      p.shuffle.forEach(idx => {
        const b = h('button', 'opt', p.items[idx]); b.disabled = seq.includes(idx);
        b.onclick = () => { seq.push(idx); api.clear(); draw(); };
        pool.append(b);
      });
      const reset = h('button', 'btn small', '처음부터'); reset.onclick = () => { seq = []; api.clear(); draw(); };
      pool.append(reset);
      api.ready(seq.length === p.items.length);
    };
    area.append(seqEl, pool); draw();
    return () => seq.every((v, i) => v === i);
  };

  // ---------- 숫자 입력 ----------
  function codeInput(p, api) {
    const inp = h('input', 'code'); inp.maxLength = p.digits || 4; inp.inputMode = 'numeric'; inp.placeholder = '숫자';
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); api.ready(inp.value.length === (p.digits || inp.value.length)); api.clear(); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') api.submit(); else if (e.key === 'Escape') api.close(); };
    setTimeout(() => inp.focus(), 30);
    return inp;
  }
  PZ.code = function (p, area, api) {
    const inp = codeInput(p, api); area.append(inp);
    return () => inp.value === p.answer;
  };

  // ---------- 다이얼 / 회전 링 (숫자 칸을 ▲▼ 로 돌린다) ----------
  function wheels(p, area, api, cls) {
    const vals = Array(p.digits).fill(0), row = h('div', 'wheels ' + cls);
    for (let i = 0; i < p.digits; i++) {
      const w = h('div', 'wheel'), num = h('div', 'wnum', '0');
      const up = h('button', 'wbtn', '▲'), dn = h('button', 'wbtn', '▼');
      const set = d => { vals[i] = (vals[i] + d + 10) % 10; num.textContent = vals[i]; w.style.setProperty('--rot', vals[i] * 36 + 'deg'); api.clear(); };
      up.onclick = () => set(1); dn.onclick = () => set(-1);
      num.onwheel = e => { e.preventDefault(); set(e.deltaY < 0 ? 1 : -1); };
      w.append(up, num, dn);
      if (p.labels) w.append(h('div', 'wlabel', p.labels[i] || ' '));
      row.append(w);
    }
    area.append(row); api.ready(true);
    return () => vals.join('') === p.answer;
  }
  PZ.dial = (p, area, api) => wheels(p, area, api, 'dial');
  PZ.rings = (p, area, api) => wheels(p, area, api, 'rings');

  // ---------- 시계 맞추기 (시 1~12, 분 5분 단위) ----------
  PZ.clock = function (p, area, api) {
    let hr = 12, mn = 0;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('class', 'clockface');
    const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.append(e); return e; };
    el('circle', { cx: 100, cy: 100, r: 92, class: 'cf-rim' });
    for (let i = 1; i <= 12; i++) {
      const a = i * Math.PI / 6, t = el('text', { x: 100 + 74 * Math.sin(a), y: 100 - 74 * Math.cos(a) + 6, class: 'cf-num' });
      t.textContent = i;
    }
    const hh = el('line', { x1: 100, y1: 100, x2: 100, y2: 52, class: 'cf-h' });
    const mh = el('line', { x1: 100, y1: 100, x2: 100, y2: 28, class: 'cf-m' });
    el('circle', { cx: 100, cy: 100, r: 5, class: 'cf-pin' });
    const label = h('div', 'clock-label');
    const draw = () => {
      hh.setAttribute('transform', `rotate(${(hr % 12) * 30 + mn / 2} 100 100)`);
      mh.setAttribute('transform', `rotate(${mn * 6} 100 100)`);
      label.textContent = `${hr}시 ${String(mn).padStart(2, '0')}분`;
    };
    const btn = (t, f) => { const b = h('button', 'btn small', t); b.onclick = () => { f(); draw(); api.clear(); }; return b; };
    const ctl = h('div', 'clock-ctl');
    ctl.append(
      h('span', 'cl-t', '시'), btn('◀', () => (hr = hr === 1 ? 12 : hr - 1)), btn('▶', () => (hr = hr === 12 ? 1 : hr + 1)),
      h('span', 'cl-t', '분'), btn('◀', () => (mn = (mn + 55) % 60)), btn('▶', () => (mn = (mn + 5) % 60)));
    const box = h('div', 'clockbox'); box.append(svg, h('div', 'clock-side'));
    box.lastChild.append(label, ctl);
    area.append(box); draw(); api.ready(true);
    return () => hr === p.answer.h && mn === p.answer.m;
  };

  // ---------- 레버 순서 ----------
  PZ.lever = function (p, area, api) {
    let seq = [];
    const byKey = Object.fromEntries(p.levers.map(l => [l.key, l]));
    const row = h('div', 'levers'), trail = h('div', 'lever-trail');
    const draw = () => {
      row.innerHTML = ''; trail.innerHTML = '';
      p.display.forEach(k => {
        const l = byKey[k], b = h('button', 'lever' + (seq.includes(k) ? ' down' : ''));
        b.style.setProperty('--c', l.color);
        b.append(h('span', 'knob'), h('span', 'stick'), h('span', 'lname', l.name));
        b.disabled = seq.includes(k);
        b.onclick = () => { seq.push(k); api.clear(); draw(); };
        row.append(b);
      });
      p.levers.forEach((_, i) => {
        const k = seq[i], d = h('span', 'dot', k ? byKey[k].name : String(i + 1));
        if (k) { d.classList.add('on'); d.style.background = byKey[k].color; }
        trail.append(d);
      });
      api.ready(seq.length === p.levers.length);
    };
    const reset = h('button', 'btn small', '레버 되돌리기'); reset.onclick = () => { seq = []; api.clear(); draw(); };
    const foot = h('div', 'row center'); foot.append(trail, reset);
    area.append(row, foot); draw();
    return () => seq.every((k, i) => k === p.answer[i]);
  };

  // ---------- 슬라이드 3×3 (같은 그림 조각끼리는 바꿔도 같음, 줄마다 그림이 맞으면 정답) ----------
  PZ.slide = function (p, area, api) {
    // 정답 배치: 줄 r 에 rows[r] 조각 3개, 마지막 칸은 빈칸(null)
    let cells = [];
    p.rows.forEach((rw, r) => { for (let c = 0; c < 3; c++) cells.push(r === 2 && c === 2 ? null : r); });
    const solved = () => cells.every((v, i) => (i === 8 ? v === null : v === Math.floor(i / 3)));
    const nb = i => [i - 3, i + 3, i % 3 ? i - 1 : -1, i % 3 < 2 ? i + 1 : -1].filter(j => j >= 0 && j < 9);
    const swap = i => { const e = cells.indexOf(null); [cells[e], cells[i]] = [cells[i], cells[e]]; };
    // 정답에서 무작위로 밀어 섞는다(항상 풀 수 있음). 같은 상태면 다시 섞는다.
    do {
      let prev = -1;
      for (let k = 0; k < (p.scramble || 60); k++) {
        const opts = nb(cells.indexOf(null)).filter(j => j !== prev);
        const j = opts[Math.floor(Math.random() * opts.length)];
        prev = cells.indexOf(null); swap(j);
      }
    } while (solved());
    const grid = h('div', 'slidegrid');
    const draw = () => {
      grid.innerHTML = '';
      cells.forEach((v, i) => {
        const t = h('button', v === null ? 'stile empty' : 'stile', v === null ? '' : p.rows[v].icon);
        if (v !== null) t.title = p.rows[v].name;
        const movable = v !== null && nb(i).includes(cells.indexOf(null));
        t.classList.toggle('movable', movable);
        t.onclick = () => { if (movable) { swap(i); api.clear(); draw(); } };
        grid.append(t);
      });
    };
    area.append(grid); draw(); api.ready(true);
    return solved;
  };

  // ---------- 암호 해독 (기호 → 숫자) ----------
  PZ.cipher = function (p, area, api) {
    const sym = h('div', 'cipher-syms');
    p.symbols.forEach(s => sym.append(h('span', 'csym', s)));
    const legend = h('div', 'cipher-legend');
    p.legend.forEach(s => legend.append(h('span', '', `${s} = ?`)));
    const inp = codeInput(p, api);
    area.append(sym, legend, inp);
    return () => inp.value === p.answer;
  };

  // ---------- 등대 신호 (같은 신호를 여러 번 쓸 수 있음) ----------
  PZ.signal = function (p, area, api) {
    let seq = [];
    const byKey = Object.fromEntries(p.signals.map(s => [s.key, s]));
    const slots = h('div', 'seq'), pad = h('div', 'sigpad');
    const draw = () => {
      slots.innerHTML = '';
      p.answer.forEach((_, i) => {
        const k = seq[i], s = h('div', 'slot' + (k ? ' filled' : ''), k ? `${byKey[k].icon} ${byKey[k].name}` : String(i + 1));
        slots.append(s);
      });
      [...pad.querySelectorAll('.sig')].forEach(b => (b.disabled = seq.length >= p.answer.length));
      api.ready(seq.length === p.answer.length);
    };
    p.signals.forEach(s => {
      const b = h('button', 'sig'); b.append(h('span', 'ico', s.icon), h('span', '', s.name));
      b.onclick = () => { seq.push(s.key); api.clear(); draw(); };
      pad.append(b);
    });
    const undo = h('button', 'btn small', '하나 지우기'); undo.onclick = () => { seq.pop(); api.clear(); draw(); };
    const reset = h('button', 'btn small', '처음부터'); reset.onclick = () => { seq = []; api.clear(); draw(); };
    pad.append(undo, reset);
    area.append(slots, pad); draw();
    return () => seq.length === p.answer.length && seq.every((k, i) => k === p.answer[i]);
  };

  // ---------- 유리 조각 2×2 (칸 0 왼위 → 1 오위 → 2 오아래 → 3 왼아래) ----------
  PZ.glass = function (p, area, api) {
    const cells = p.start.map(x => ({ p: x.p, r: x.r }));
    const POS = [0, 1, 3, 2]; // 칸 번호 → 2×2 그리드에서의 위치(행 우선)
    let sel = -1;
    const grid = h('div', 'glassgrid');
    const draw = () => {
      grid.innerHTML = '';
      const order = [];
      cells.forEach((c, i) => (order[POS[i]] = i));
      order.forEach(i => {
        const c = cells[i], pc = p.pieces[c.p];
        const cell = h('div', 'gcell' + (sel === i ? ' sel' : ''));
        const piece = h('button', 'gpiece');
        piece.style.background = pc.color;
        piece.style.transform = `rotate(${c.r * 90}deg)`;
        piece.append(h('span', 'gtri', '▲'), h('span', 'gname', pc.name));
        piece.onclick = () => {
          api.clear();
          if (sel === -1) sel = i;
          else if (sel === i) sel = -1;
          else { [cells[sel], cells[i]] = [cells[i], cells[sel]]; sel = -1; }
          draw();
        };
        const rot = h('button', 'grot', '⟳'); rot.title = '돌리기';
        rot.onclick = () => { c.r = (c.r + 1) % 4; api.clear(); draw(); };
        cell.append(piece, rot); grid.append(cell);
      });
    };
    area.append(grid); draw(); api.ready(true);
    const target = p.target || [0, 0, 0, 0]; // 조각마다 ▲ 가 가리켜야 할 쪽
    return () => cells.every((c, i) => c.p === i && c.r === target[i]);
  };
})();

/* ===== 퍼즐 그림 부품 (assets/puzzle/*.webp) =====
   그림이 있으면 같은 규칙 그대로, 보이는 모습만 그림으로 바꾼다. 부품이 없으면 위의 기본 모양을 쓴다. */
(function () {
  const EF = window.EF, PZ = EF.PZ, h = EF.h;
  const has = k => EF.artHas('puzzle/' + k), src = k => EF.artSrc('puzzle/' + k);
  const img = (k, cls) => { const i = h('img', cls || ''); i.src = src(k); i.alt = ''; i.draggable = false; return i; };

  // --- 서랍 자물쇠 · 지워진 쪽수: 자물쇠 판(또는 책 쪽) 위에 숫자 바퀴가 굴러간다 ---
  const baseDial = PZ.dial, baseCipher = PZ.cipher;
  function drumRow(p, api) {
    const vals = Array(p.digits).fill(0), row = h('div', 'pa-drums');
    for (let i = 0; i < p.digits; i++) {
      const d = h('div', 'pa-drum'); d.style.backgroundImage = `url(${src('drawer-wheel')})`;
      const strip = h('div', 'pa-strip');
      for (let n = -1; n <= 10; n++) strip.append(h('span', '', String((n + 10) % 10)));
      d.append(strip);
      const set = dd => { vals[i] = (vals[i] + dd + 10) % 10; strip.style.transform = `translateY(${-(vals[i] + 1) * 100 / 12}%)`; api.clear(); };
      const up = h('button', 'pa-arrow up', '▲'), dn = h('button', 'pa-arrow dn', '▼');
      up.onclick = () => set(1); dn.onclick = () => set(-1);
      d.onwheel = e => { e.preventDefault(); set(e.deltaY < 0 ? 1 : -1); };
      const col = h('div', 'pa-drumcol'); col.append(up, d, dn); row.append(col); set(0);
    }
    return { row, vals };
  }
  PZ.dial = function (p, area, api) {
    if (!(has('drawer-lock') && has('drawer-wheel'))) return baseDial(p, area, api);
    const plate = h('div', 'pa-plate lock'); plate.append(img('drawer-lock', 'pa-bg'));
    const { row, vals } = drumRow(p, api); plate.append(row);
    area.append(plate); api.ready(true);
    return () => vals.join('') === p.answer;
  };
  PZ.cipher = function (p, area, api) {
    if (!(has('oldrec-page') && has('drawer-wheel'))) return baseCipher(p, area, api);
    const plate = h('div', 'pa-plate page'); plate.append(img('oldrec-page', 'pa-bg'));
    const { row, vals } = drumRow(p, api); plate.append(row);
    const legend = h('div', 'cipher-legend'); p.legend.forEach(s => legend.append(h('span', '', `${s} = ?`)));
    area.append(plate, legend); api.ready(true);
    return () => vals.join('') === p.answer;
  };

  // --- 회전 선반: 받침 위에 나이테 링 4개가 각각 돈다 (홈 10개 = 숫자 0~9) ---
  const baseRings = PZ.rings;
  PZ.rings = function (p, area, api) {
    const keys = ['shelf-ring1', 'shelf-ring2', 'shelf-ring3', 'shelf-ring4'];
    if (!(has('shelf-base') && keys.every(has))) return baseRings(p, area, api);
    const vals = Array(p.digits).fill(0), wrap = h('div', 'pa-rings');
    const stack = h('div', 'pa-ringstack'); stack.append(img('shelf-base', 'pa-bg'));
    const sizes = [0.86, 0.66, 0.47, 0.3], ctl = h('div', 'pa-ringctl'), sets = [];
    // 누른 곳이 가운데에서 얼마나 떨어졌는지로 어느 링인지 정한다 (링이 겹쳐 있어서)
    const ringAt = e => { const b = stack.getBoundingClientRect(), dx = e.clientX - b.left - b.width / 2, dy = e.clientY - b.top - b.height / 2;
      const d = Math.hypot(dx, dy) / b.width * 2; for (let i = sizes.length - 1; i >= 0; i--) if (d <= sizes[i] * .98) return i; return -1; };
    stack.onclick = e => { const i = ringAt(e); if (i >= 0) sets[i](1); };
    stack.oncontextmenu = e => { const i = ringAt(e); if (i >= 0) { e.preventDefault(); sets[i](-1); } };
    stack.onwheel = e => { const i = ringAt(e); if (i >= 0) { e.preventDefault(); sets[i](e.deltaY < 0 ? 1 : -1); } };
    keys.forEach((k, i) => {
      const r = img(k, 'pa-ring'); r.style.width = r.style.height = sizes[i] * 100 + '%'; stack.append(r);
      const num = h('b', 'pa-ringnum', '0');
      const set = d => { vals[i] = (vals[i] + d + 10) % 10; r.style.transform = `translate(-50%,-50%) rotate(${vals[i] * 36}deg)`; num.textContent = vals[i]; api.clear(); };
      sets[i] = set;
      const line = h('div', 'pa-ringrow');
      const dn = h('button', 'wbtn', '◀'), up = h('button', 'wbtn', '▶'); dn.onclick = () => set(-1); up.onclick = () => set(1);
      line.append(h('span', 'pa-ringlbl', p.labels && p.labels[i] ? p.labels[i] : `${i + 1}번째`), dn, num, up); ctl.append(line);
      set(0);
    });
    wrap.append(stack, ctl); area.append(wrap); api.ready(true);
    return () => vals.join('') === p.answer;
  };

  // --- 우편함 시계: 시계판 위에 시침 · 분침 그림이 돈다 ---
  const baseClock = PZ.clock;
  PZ.clock = function (p, area, api) {
    if (!(has('mailbox-clock') && has('mailbox-hour') && has('mailbox-minute'))) return baseClock(p, area, api);
    let hr = 12, mn = 0;
    const face = h('div', 'pa-clock'); face.append(img('mailbox-clock', 'pa-bg'));
    const H = img('mailbox-hour', 'pa-hand hour'), M = img('mailbox-minute', 'pa-hand minute'); face.append(H, M);
    const label = h('div', 'clock-label');
    const draw = () => {
      H.style.transform = `rotate(${(hr % 12) * 30 + mn / 2}deg)`;
      M.style.transform = `rotate(${mn * 6}deg)`;
      label.textContent = `${hr}시 ${String(mn).padStart(2, '0')}분`;
    };
    const btn = (t, f) => { const b = h('button', 'btn small', t); b.onclick = () => { f(); draw(); api.clear(); }; return b; };
    const ctl = h('div', 'clock-ctl');
    ctl.append(h('span', 'cl-t', '시'), btn('◀', () => (hr = hr === 1 ? 12 : hr - 1)), btn('▶', () => (hr = hr === 12 ? 1 : hr + 1)),
      h('span', 'cl-t', '분'), btn('◀', () => (mn = (mn + 55) % 60)), btn('▶', () => (mn = (mn + 5) % 60)));
    const box = h('div', 'clockbox'), side = h('div', 'clock-side'); side.append(label, ctl); box.append(face, side);
    area.append(box); draw(); api.ready(true);
    return () => hr === p.answer.h && mn === p.answer.m;
  };

  // --- 새집 레버: 장치 바탕 위에 색 레버 그림 ---
  const baseLever = PZ.lever;
  PZ.lever = function (p, area, api) {
    if (!(has('lever-base') && p.levers.every(l => has('lever-' + l.key)))) return baseLever(p, area, api);
    let seq = [];
    const byKey = Object.fromEntries(p.levers.map(l => [l.key, l]));
    const dev = h('div', 'pa-levdev'); dev.append(img('lever-base', 'pa-bg'));
    const row = h('div', 'pa-levrow'); dev.append(row);
    const trail = h('div', 'lever-trail');
    const draw = () => {
      row.innerHTML = ''; trail.innerHTML = '';
      p.display.forEach(k => {
        const b = h('button', 'pa-lever' + (seq.includes(k) ? ' down' : '')); b.title = byKey[k].name;
        b.append(img('lever-' + k)); b.disabled = seq.includes(k);
        b.onclick = () => { seq.push(k); api.clear(); draw(); };
        row.append(b);
      });
      p.levers.forEach((_, i) => {
        const k = seq[i], d = h('span', 'dot', k ? byKey[k].name : String(i + 1));
        if (k) { d.classList.add('on'); d.style.background = byKey[k].color; }
        trail.append(d);
      });
      api.ready(seq.length === p.levers.length);
    };
    const reset = h('button', 'btn small', '레버 되돌리기'); reset.onclick = () => { seq = []; api.clear(); draw(); };
    const foot = h('div', 'row center'); foot.append(trail, reset);
    area.append(dev, foot); draw();
    return () => seq.every((k, i) => k === p.answer[i]);
  };

  // --- 기록 조각 슬라이드 · 유리 조각: 칸 · 조각을 그림으로 ---
  const TILE = { sun: 'archive-tile-sun', tower: 'archive-tile-tower', wave: 'archive-tile-wave' };
  const GLASS = { dawn: 'glass-dawn', noon: 'glass-noon', dusk: 'glass-dusk', night: 'glass-night' };
  const baseSlide = PZ.slide, baseGlass = PZ.glass;
  PZ.slide = function (p, area, api) {
    const ok = baseSlide(p, area, api);
    if (!p.rows.every(r => has(TILE[r.key])) || !has('archive-frame')) return ok;
    const grid = area.querySelector('.slidegrid'); if (!grid) return ok;
    grid.classList.add('pz-art'); grid.style.backgroundImage = `url(${src('archive-frame')})`;
    const paint = () => grid.querySelectorAll('.stile:not(.empty)').forEach(t => {
      const r = p.rows.find(x => x.icon === t.textContent || x.name === t.title);
      if (r) { t.style.backgroundImage = `url(${src(TILE[r.key])})`; t.classList.add('pic'); }
    });
    paint(); new MutationObserver(paint).observe(grid, { childList: true });
    return ok;
  };
  PZ.glass = function (p, area, api) {
    const ok = baseGlass(p, area, api);
    if (!p.pieces.every(x => has(GLASS[x.key])) || !has('glass-frame')) return ok;
    const grid = area.querySelector('.glassgrid'); if (!grid) return ok;
    grid.classList.add('pz-art'); grid.style.backgroundImage = `url(${src('glass-frame')})`;
    const paint = () => grid.querySelectorAll('.gpiece').forEach(g => {
      const pc = p.pieces.find(x => x.name === (g.querySelector('.gname') || {}).textContent);
      if (pc) { g.style.background = `url(${src(GLASS[pc.key])}) center/cover`; g.classList.add('pic'); }
    });
    paint(); new MutationObserver(paint).observe(grid, { childList: true });
    return ok;
  };

  // --- 등대 신호: 꺼진 램프 위에 누른 신호의 빛이 켜진다 ---
  const LIGHT = { morning: 'letter-light-morning', noon: 'letter-light-noon', evening: 'letter-light-evening', night: 'letter-light-night' };
  const baseSignal = PZ.signal;
  PZ.signal = function (p, area, api) {
    const ok = baseSignal(p, area, api);
    if (!has('letter-lamp') || !p.signals.every(s => has(LIGHT[s.key]))) return ok;
    const lamp = h('div', 'pa-lamp'); lamp.append(img('letter-lamp', 'pa-bg'));
    const glow = h('img', 'pa-glow'); glow.alt = ''; lamp.append(glow);
    area.prepend(lamp);
    area.querySelectorAll('.sig').forEach((b, i) => {
      const s = p.signals[i]; if (!s) return;
      b.addEventListener('click', () => {
        glow.src = src(LIGHT[s.key]); glow.classList.remove('on'); void glow.offsetWidth; glow.classList.add('on');
      });
      const ic = b.querySelector('.ico'); if (ic) { ic.textContent = ''; ic.append(img(LIGHT[s.key], 'pa-sigico')); }
    });
    return ok;
  };
})();

</script>
<script>
/* 오버레이: 조사 텍스트(INSPECT) · 대화(DIALOGUE) · 퍼즐(PUZZLE) · 엔딩, 그리고 큐 처리. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  function scrim() { const s = h('div', 'scrim'); UI.stage.append(s); return s; }
  function closeWith(node, done) {
    node.remove(); UI.dismiss = null; done();
  }

  UI.showText = function (it, done) {
    const sc = scrim(), box = h('div', 'textbox');
    if (it.who) box.append(h('div', 'who', it.who));
    box.append(h('div', 'body', it.text));
    if (it.note && EF.CONFIG.showMemo) box.append(h('div', 'note', '✔ ' + it.note));
    box.append(h('div', 'next', '▼ 클릭'));
    sc.append(box);
    const close = () => closeWith(sc, done);
    sc.onclick = close; UI.dismiss = close;
  };

  UI.showSay = function (it, done) {
    const n = EF.NPCS[it.npc];
    // 인물 크롭: 배경 속 인물을 누르면 따로 그린 인물 그림이 그림 창 전체에 뜨고, 대화창이 그 위에 얹힌다
    const cu = h('div', 'closeup npc-cu');
    const nimg = EF.npcImg(it.npc);
    if (nimg) { // 장면 배경을 흐리게 깔고, 인물 그림을 왼쪽에 크게
      cu.classList.add('has-img');
      cu.append(EF.blurBg());
      const im = h('img', 'npc-art'); im.src = nimg; im.alt = n.name; cu.append(im);
    }
    else {
      cu.style.background = `radial-gradient(ellipse at 50% 38%, ${n.color} 0%, #2b2638 85%)`;
      cu.append(h('div', 'npc-ph', n.name), h('div', 'cv-tag', `임시 그림 · assets/npc/${it.npc}.png`));
    }
    UI.stage.append(cu);
    const sc = scrim(), box = h('div', 'textbox dialogue');
    const pages = it.pages || [{ who: it.npc, text: EF.npcLine(it.npc, it.ctx) }];
    const por = h('div', 'portrait'), head = h('div', 'dhead'), body = h('div', 'body');
    const btn = h('button', 'btn close'), count = h('span', 'dcount');
    const col = h('div', 'dcol'); col.append(head, body);
    const side = h('div', 'dside'); side.append(count, btn);
    box.append(por, col, side);
    sc.append(box);
    let i = 0;
    const draw = () => {
      const pg = pages[i], who = EF.NPCS[pg.who] || n;
      por.textContent = who.name[0]; por.style.background = who.color;
      box.classList.toggle('is-clover', pg.who === 'clover');
      head.innerHTML = '';
      head.append(h('b', '', who.name)); // 이름만 보인다 (역할·설정 문구는 화면에 쓰지 않음)
      if (it.ctx && pg.who === it.npc) head.append(h('span', 'ctx', it.ctx));
      body.textContent = pg.text;
      const last = i === pages.length - 1;
      btn.textContent = last ? '닫기' : '다음 ▶';
      count.textContent = pages.length > 1 ? `${i + 1} / ${pages.length}` : '';
    };
    const close = () => { cu.remove(); closeWith(sc, done); };
    const next = () => { if (i < pages.length - 1) { i++; draw(); } else close(); };
    btn.onclick = e => { e.stopPropagation(); next(); };
    sc.onclick = e => { if (e.target === sc) next(); };
    UI.dismiss = next; // Enter/Space/Esc: 다음 장, 마지막 장이면 닫기
    draw();
  };

  // 엔딩: 오류가 화면을 덮고 창 밖의 아리아가 바라보다가, 사이트가 강제로 초기화된다 (glitch.js G.finale).
  //       예전 엔딩 카드(EF.TEXT.ending)는 연출을 쓸 수 없을 때만 쓴다.
  //       마지막 퍼즐의 창문 클로즈업(it.view)을 띄운 채로 시작한다.
  UI.showEnding = function (done, it = {}) {
    if (EF.Glitch && EF.Glitch.finale) {
      UI.showView({ view: it.view || 'v-atelier' }, () => {}); // 창문은 닫히지 않는다 (done 은 부르지 않는다: 곧 초기화)
      UI.busy = true; UI.dismiss = () => {};
      const cus = UI.stage.querySelectorAll('.closeup'); EF.Glitch.finale(cus[cus.length - 1]);
      return;
    }
    const sc = scrim(); sc.classList.add('dim');
    const card = h('div', 'ending');
    card.append(h('h2', '', EF.TEXT.ending.title));
    EF.TEXT.ending.body.split('\n').forEach(l => card.append(h('p', '', l || ' ')));
    const b = h('button', 'btn primary', EF.TEXT.ending.btn);
    card.append(b); sc.append(card);
    const close = () => closeWith(sc, done);
    b.onclick = close; UI.dismiss = close;
  };

  // ---------- 퍼즐 ----------
  // 유형별 화면은 pz.js(EF.PZ). 건너뛰기 없음 · 닫아도 미해결 유지 · 오답 EF.HINT_AFTER(3)회부터 힌트.
  // 퍼즐 창은 Esc(또는 닫기 버튼)로만 닫힌다. Enter/Space 로는 닫히지 않는다.
  UI.showPuzzle = function (pid, done) {
    const p = EF.PUZZLES[pid], sc = scrim(); sc.classList.add('dim');
    const card = h('div', 'puzzle pz-' + p.type);
    const head = h('div', 'phead');
    head.append(h('h3', '', p.title));
    if (p.level) head.append(h('span', 'plevel', p.level));
    card.append(head, h('p', 'prompt', p.prompt));
    const area = h('div', 'parea');
    const msg = h('div', 'pmsg', '');
    const hint = h('div', 'phint');
    const actions = h('div', 'pactions');
    const cancel = h('button', 'btn', '닫기 (Esc)');
    const okBtn = h('button', 'btn primary', '확인'); okBtn.disabled = true;
    actions.append(cancel, okBtn);
    card.append(area, msg, hint, actions); sc.append(card);

    const fails = () => EF.state.fails[pid] || 0;
    const showHint = () => {
      if (fails() >= EF.HINT_AFTER && p.hint) { hint.textContent = '힌트 · ' + p.hint; hint.classList.add('on'); }
    };
    const close = solved => {
      sc.remove(); UI.dismiss = null; UI.dismissEscOnly = false;
      done(solved ? EF.solvePuzzle(pid) : []);
    };
    let isOk = () => false;
    const submit = () => {
      if (okBtn.disabled) return;
      if (isOk()) { close(true); return; }
      EF.state.fails[pid] = fails() + 1;
      msg.textContent = p.fail;
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      showHint();
    };
    const api = {
      ready: on => { okBtn.disabled = !on; },
      clear: () => { msg.textContent = ''; },
      submit,
      close: () => close(false)
    };
    const make = EF.PZ[p.type];
    if (make) isOk = make(p, area, api);
    else console.warn('알 수 없는 퍼즐 유형', p.type);
    showHint(); // 이미 3번 틀린 퍼즐은 다시 열어도 힌트가 보인다

    okBtn.onclick = submit;
    cancel.onclick = () => close(false);
    UI.dismiss = () => close(false);
    UI.dismissEscOnly = true;
  };

  // ---------- 큐 처리 ----------
  UI.run = function (queue) {
    UI.busy = true;
    UI.render();
    const next = () => {
      // 엔딩이 들어 있으면: 마지막 퍼즐의 창문 클로즈업과 함께 엔딩만 바로 시작한다 (단계 알림 · 알림 글은 건너뜀)
      if (queue.some(x => x.t === 'ending') && queue[0].t !== 'ending') { const v = queue.find(x => x.t === 'view'); queue.splice(0, queue.length, { t: 'ending', view: v && v.view }); }
      const it = queue.shift();
      if (!it) { UI.busy = false; UI.render(); return; }
      switch (it.t) {
        case 'toast': UI.toast(it.text, it.kind); UI.render(); next(); break;
        case 'hint': if (EF.Guide) EF.Guide.note(it.text); next(); break;
        case 'text': UI.showText(it, next); break;
        case 'view': UI.showView(it, next); break;
        case 'shake': UI.shake(); next(); break;
        case 'say': UI.showSay(it, next); break;
        case 'puzzle': UI.showPuzzle(it.id, q => { queue.unshift(...q); next(); }); break;
        case 'stage': UI.render(); UI.banner(it.stage); next(); break;
        case 'ending': UI.render(); UI.showEnding(next, it); break;
        default: next();
      }
    };
    next();
  };
})();

</script>
<script>
/* 클로즈업 장면. 조사 요소를 누르면 그림 창 전체가 그 물건을 가까이 본 장면으로 바뀐다.
   글로 설명하지 않는다(제목·설명 문장 없음). 힌트는 그림 속 사물로만 보인다.
   돌아가기: 장면과 똑같이 그림 하단(▼ 띠)을 클릭. 키보드는 Esc.
   그림 데이터는 src/data/views.js. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (svg, tag, at, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in at) e.setAttribute(k, at[k]);
    if (text !== undefined) e.textContent = text;
    svg.append(e); return e;
  };
  const newSvg = (w, hh) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${hh}`); return s; };
  const R = {}; // kind 별 그리기

  R.pic = (v, id) => {
    const box = h('div', 'cv-pic');
    if (id && EF.viewImg(id)) {
      box.style.backgroundImage = `url(${EF.viewImg(id)})`;
      box.classList.add('has-img');
    } else {
      const [a, b] = v.tone || ['#e9e4dc', '#9c9284'];
      box.style.background = `radial-gradient(ellipse at 50% 45%, ${a} 0%, ${b} 100%)`;
      box.append(h('div', 'cv-icon', v.icon || '?'));
      if (id) box.append(h('div', 'cv-tag', `임시 그림 · assets/view/${id}.png`));
    }
    return box;
  };

  R.doc = v => {
    const box = h('div', 'cv-doc paper-' + (v.paper || 'note') + (v.blur ? ' blur' : ''));
    const sheet = h('div', 'd-sheet');
    if (v.head) sheet.append(h('div', 'd-head', v.head));
    if (v.cols || v.rows.some(Array.isArray)) {
      const t = h('table', 'd-table');
      if (v.cols) { const tr = h('tr'); v.cols.forEach(c => tr.append(h('th', '', c))); t.append(tr); }
      v.rows.forEach(r => { const tr = h('tr'); [].concat(r).forEach(c => tr.append(h('td', '', c))); t.append(tr); });
      sheet.append(t);
    } else v.rows.forEach(r => sheet.append(h('p', 'd-line', r || ' ')));
    if (v.foot) sheet.append(h('div', 'd-foot', v.foot));
    box.append(sheet);
    return box;
  };

  R.strip = v => {
    const box = h('div', 'cv-strip');
    const sheet = h('div', 'st-sheet');
    if (v.rtl) { // 오른쪽 끝(●)에서 시작해 왼쪽으로 읽는다: 화면에는 거꾸로 놓고 화살표는 ←
      const items = v.items.slice().reverse();
      items.forEach((icon, i) => { if (i) sheet.append(h('span', 'st-arrow', '←')); sheet.append(h('span', 'st-icon', icon)); });
      sheet.append(h('span', 'st-start', '●'));
    } else v.items.forEach((icon, i) => { if (i) sheet.append(h('span', 'st-arrow', '→')); sheet.append(h('span', 'st-icon', icon)); });
    box.append(sheet);
    return box;
  };

  R.clock = v => {
    const box = h('div', 'cv-clock');
    const svg = newSvg(200, 200);
    svgEl(svg, 'circle', { cx: 100, cy: 100, r: 94, class: 'ck-rim' });
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, r1 = i % 5 ? 86 : 80;
      svgEl(svg, 'line', { x1: 100 + r1 * Math.sin(a), y1: 100 - r1 * Math.cos(a), x2: 100 + 90 * Math.sin(a), y2: 100 - 90 * Math.cos(a), class: i % 5 ? 'ck-tick' : 'ck-tick big' });
    }
    ['XII', 'III', 'VI', 'IX'].forEach((n, i) => {
      const a = i * Math.PI / 2;
      svgEl(svg, 'text', { x: 100 + 66 * Math.sin(a), y: 100 - 66 * Math.cos(a) + 7, class: 'ck-num' }, n);
    });
    // 시계 방향 표시(바늘은 늘 이 방향으로만 돈다)
    svgEl(svg, 'path', { d: 'M 128 30 A 76 76 0 0 1 170 72', class: 'ck-dir' });
    svgEl(svg, 'path', { d: 'M 170 72 l -9 -2 m 9 2 l 1 -9', class: 'ck-dir' });
    svgEl(svg, 'line', { x1: 100, y1: 100, x2: 100, y2: 50, class: 'ck-h', transform: `rotate(${(v.h % 12) * 30 + v.m / 2} 100 100)` });
    svgEl(svg, 'line', { x1: 100, y1: 108, x2: 100, y2: 22, class: 'ck-m', transform: `rotate(${v.m * 6} 100 100)` });
    svgEl(svg, 'circle', { cx: 100, cy: 100, r: 5, class: 'ck-pin' });
    box.append(svg);
    return box;
  };

  R.lights = v => {
    const box = h('div', 'cv-lights');
    const n = v.colors.length;
    const LAMP = { '#e8c547': 'yellow', '#5b8fd9': 'blue', '#5fb37a': 'green', '#e59ac0': 'pink' }; // 해파리 조명 그림(있으면)
    const useImg = v.colors.every(c => EF.artHas('el/jelly-' + LAMP[c]));
    if (useImg) box.classList.add('lamps');
    v.colors.forEach((c, i) => {
      const b = useImg ? h('img', 'bulb lamp') : h('div', 'bulb'); b.style.setProperty('--c', c);
      if (useImg) { b.src = EF.artSrc('el/jelly-' + LAMP[c]); b.alt = ''; }
      const k = v.order ? v.order.indexOf(i) : i; // 몇 번째로 켜지는지
      b.style.animationDelay = (k * 0.7) + 's'; b.style.animationDuration = (n * 0.7 + 1.2) + 's';
      box.append(b);
    });
    return box;
  };

  // 망토 옷걸이: 가로 봉에 옷걸이가 줄지어 있고, 옷걸이마다 꼬리표가 크게 달려 있다
  R.rack = v => {
    const box = h('div', 'cv-rack');
    const bar = h('div', 'rk-bar'), row = h('div', 'rk-row');
    v.items.forEach(it => {
      const hg = h('div', 'rk-hanger' + (it.color ? '' : ' empty'));
      hg.append(h('div', 'rk-hook'));
      if (it.color) { const c = h('div', 'rk-cloak'); c.style.setProperty('--c', it.color); hg.append(c); }
      const tag = h('div', 'rk-tag'); tag.append(h('span', 'rk-ico', it.tag), h('span', 'rk-name', it.name));
      hg.append(tag); row.append(hg);
    });
    box.append(bar, row);
    return box;
  };

  // 망토 완성 도안: 벽에 핀으로 꽂힌 모눈 도안 종이. 망토 모양 안이 가로 세 띠로 나뉘고, 띠마다 같은 문양이 수놓여 있다.
  R.pattern = v => {
    const box = h('div', 'cv-pattern');
    const sheet = h('div', 'pt-sheet');
    ['tl', 'tr', 'bl', 'br'].forEach(k => sheet.append(h('span', 'pt-pin ' + k)));
    const cloak = h('div', 'pt-cloak');
    const ol = newSvg(440, 470); ol.setAttribute('class', 'pt-outline'); ol.setAttribute('preserveAspectRatio', 'none');
    svgEl(ol, 'polygon', { points: '158,3 282,3 437,85 412,467 28,467 3,85' });
    cloak.append(ol, h('div', 'pt-collar'));
    v.rows.forEach(icon => { const r = h('div', 'p-row'); for (let i = 0; i < 4; i++) r.append(h('span', '', icon)); cloak.append(r); });
    sheet.append(cloak, h('div', 'pt-scissors', '✂'));
    box.append(sheet);
    return box;
  };

  // 천 위의 바느질 줄: 앞쪽 땀은 실로 꿰매져 있고, 바늘이 마지막 땀에 꽂힌 채 멈춰 있다. 남은 자리는 바늘구멍만.
  // (누르는 버튼이 아니라 보기만 하는 단서 · 번호 없이 땀 수를 세게 한다)
  R.steps = v => {
    const box = h('div', 'cv-steps');
    const cloth = h('div', 's-cloth');
    if (v.mark) cloth.append(h('div', 's-tag', v.mark));
    const row = h('div', 's-row');
    for (let i = 1; i <= v.total; i++) {
      const st = h('div', 's-st' + (i <= v.done ? ' sewn' : ''));
      if (i === v.done) { st.classList.add('last'); st.append(h('span', 's-needle')); }
      row.append(st);
    }
    cloth.append(row); box.append(cloth);
    return box;
  };

  R.pins = v => {
    const box = h('div', 'cv-pins paper-' + (v.paper || 'cork'));
    v.items.forEach((it, i) => {
      const n = h('div', 'pin-note');
      if (it.icon) n.append(h('div', 'pn-icon', it.icon));
      if (it.text) n.append(h('div', 'pn-text', it.text));
      if (it.mark) n.append(h('div', 'pn-mark', it.mark));
      n.style.transform = `rotate(${[-3, 2, -1, 3, -2, 1, -4, 2, 0, -2][i % 10]}deg)`;
      box.append(n);
    });
    return box;
  };

  R.stack = v => {
    const box = h('div', 'cv-stack');
    for (let i = 0; i < v.count; i++) {
      const s = h('div', 'st-item');
      s.append(h('span', 'si-icon', v.icon));
      if (v.mark) s.append(h('span', 'si-mark', v.mark));
      s.style.transform = `translate(${(i - (v.count - 1) / 2) * 230}px, ${Math.abs(i - (v.count - 1) / 2) * 18}px) rotate(${(i - 1) * 5}deg)`;
      box.append(s);
    }
    return box;
  };

  // 「나이테 읽는 법」: 바깥 링부터 ①②③④, 시계는 긴 바늘(분) ① → 짧은 바늘(시) ②
  R.ringguide = () => {
    const box = h('div', 'cv-doc paper-book');
    const svg = newSvg(900, 420); svg.setAttribute('class', 'rg-svg');
    const rings = [175, 130, 85, 40];
    rings.forEach(r => svgEl(svg, 'circle', { cx: 230, cy: 210, r, class: 'rg-ring' }));
    // 번호는 오른쪽 아래 대각선 위에 바깥부터 1 2 3 4
    rings.forEach((r, i) => {
      const x = 230 + r * 0.707, y = 210 + r * 0.707;
      svgEl(svg, 'circle', { cx: x, cy: y, r: 17, class: 'rg-badge' });
      svgEl(svg, 'text', { x, y: y + 7, class: 'rg-num' }, String(i + 1));
    });
    // 바깥에서 안쪽으로 들어가는 화살표(왼쪽 위 대각선)
    svgEl(svg, 'path', { d: 'M 60 40 L 190 170', class: 'rg-arrow' });
    svgEl(svg, 'path', { d: 'M 172 170 L 192 172 L 190 152', class: 'rg-arrow' });
    // 시계: 긴 바늘 ① 먼저, 짧은 바늘 ② 나중
    svgEl(svg, 'circle', { cx: 660, cy: 210, r: 150, class: 'rg-clock' });
    svgEl(svg, 'line', { x1: 660, y1: 210, x2: 790, y2: 150, class: 'rg-long' });
    svgEl(svg, 'line', { x1: 660, y1: 210, x2: 600, y2: 290, class: 'rg-short' });
    svgEl(svg, 'circle', { cx: 660, cy: 210, r: 7, class: 'rg-pin' });
    svgEl(svg, 'circle', { cx: 800, cy: 122, r: 20, class: 'rg-badge' });
    svgEl(svg, 'text', { x: 800, y: 129, class: 'rg-num' }, '1');
    svgEl(svg, 'circle', { cx: 580, cy: 318, r: 20, class: 'rg-badge' });
    svgEl(svg, 'text', { x: 580, y: 325, class: 'rg-num' }, '2');
    box.append(svg);
    return box;
  };

  // it: { view: 'v-…' | {kind…} }
  //   그림 파일: assets/view/<ID>.png (EF.VIEW_IMAGES 에 등록). 기본은 그림 그대로, overlay:true 인 것만 그림 위에 글을 얹는다.
  UI.showView = function (it, done) {
    const id = typeof it.view === 'string' ? it.view : null;
    const v = id ? EF.VIEWS[id] : (it.view || { kind: 'pic' });
    if (!v) { console.warn('알 수 없는 클로즈업', it.view); done(); return; }

    const cu = h('div', 'closeup' + (EF.isEnded() ? ' quiet' : ''));
    cu.dataset.view = id || '';
    const hasImg = !!(id && EF.viewImg(id));
    // 그림이 있을 때:
    //  - 기본(퍼즐 단서 그림): 글자·숫자·기호까지 그림에 그려져 있으므로 그림만 보여 준다.
    //  - overlay:true(퍼즐과 무관한 그림): 글 없는 바탕 그림 위 box 영역에 글을 얹는다. bare:true 면 종이 바탕도 뺀다.
    const content = hasImg && !v.overlay ? R.pic({}, id) : (R[v.kind] || R.pic)(v, id);
    if (hasImg && v.overlay && v.kind !== 'pic') {
      const pb = h('div', 'cu-picbg'); pb.style.backgroundImage = `url(${EF.viewImg(id)})`; cu.append(pb); // 글을 얹을 바탕 그림
      content.classList.add('on-img');
      if (v.bare) content.classList.add('bare');
      const b = v.box || [240, 110, 800, 500];
      Object.assign(content.style, { position: 'absolute', left: b[0] + 'px', top: b[1] + 'px', width: b[2] + 'px', height: b[3] + 'px' });
    }
    cu.append(content);
    if (hasImg) { cu.classList.add('has-img'); cu.append(EF.blurBg()); } // 흐린 장면 배경(뒤에 깔림)
    // 돌아가기: 장면과 같은 하단 띠 + ▼
    const back = h('div', 'edge-back'); back.append(h('div', 'edge-arrow'));
    cu.append(back);
    UI.stage.append(cu);

    const close = () => { cu.remove(); UI.dismiss = null; UI.dismissEscOnly = false; done(); };
    back.onclick = e => { e.stopPropagation(); close(); };
    UI.dismiss = close; UI.dismissEscOnly = true; // 키보드는 Esc 만(Enter/Space 로는 안 닫힘)
  };
})();

</script>
<script>
/* 추리 수첩(NOTEBOOK): 증거 목록 + 필수/선택 추리. 슬롯에 증거를 채워 "연결"하면 가설이 기록된다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  UI.openNotebook = function () {
    if (UI.busy) return;
    UI.busy = true;
    const sc = h('div', 'scrim dim nbscrim'), panel = h('div', 'notebook');
    sc.append(panel); UI.stage.append(sc);
    let active = null, picks = [], detail = null, message = '';

    const close = () => { sc.remove(); UI.dismiss = null; UI.busy = false; UI.render(); };
    UI.dismiss = close;
    sc.onclick = e => { if (e.target === sc) close(); };

    function draw() {
      panel.innerHTML = '';
      const head = h('div', 'nb-head');
      head.append(h('h2', '', '📓 추리 수첩'));
      const x = h('button', 'btn', '닫기 (Esc)'); x.onclick = close; head.append(x);
      const cols = h('div', 'nb-cols');
      cols.append(drawEvidence(), drawDeductions());
      panel.append(head, cols);
    }

    function drawEvidence() {
      const left = h('div', 'nb-left');
      [['trace', '리셋 흔적'], ['clue', '단서'], ['opt', '선택 단서']].forEach(([type, title]) => {
        const own = Object.keys(EF.state.evidence).filter(id => EF.EVIDENCE[id].type === type)
          .sort((a, b) => EF.state.evidence[a] - EF.state.evidence[b]);
        left.append(h('h4', '', `${title} (${own.length})`));
        const list = h('div', 'evlist');
        if (!own.length) list.append(h('div', 'empty', '아직 없음'));
        own.forEach(id => {
          const e = EF.EVIDENCE[id];
          const b = h('button', 'ev' + (picks.includes(id) ? ' picked' : ''), `${id} · ${e.name}`);
          b.onclick = () => {
            detail = id; message = '';
            if (active && picks.length < active.requires.length && !picks.includes(id)) picks.push(id);
            draw();
          };
          list.append(b);
        });
        left.append(list);
      });
      const d = h('div', 'evdetail');
      if (detail) {
        const e = EF.EVIDENCE[detail];
        d.append(h('b', '', `${detail} · ${e.name}`), h('span', 'place', e.place), h('p', '', e.desc));
      } else d.append(h('p', 'empty', '증거를 누르면 설명이 보입니다. 추리 카드를 선택한 뒤 증거를 누르면 슬롯에 채워집니다.'));
      left.append(d);
      return left;
    }

    function drawDeductions() {
      const right = h('div', 'nb-right');
      [['main', '필수 추리'], ['final', '통합 추리'], ['opt', '선택 추리 (엔딩 조건과 무관)']].forEach(([kind, title]) => {
        right.append(h('h4', '', title));
        EF.DEDUCTIONS.filter(d => d.kind === kind).forEach(d => right.append(card(d)));
      });
      return right;
    }

    function card(d) {
      const solved = !!EF.state.deduced[d.id];
      const c = h('div', 'dcard' + (solved ? ' solved' : '') + (active === d ? ' active' : ''));
      const top = h('div', 'dtop');
      top.append(h('b', '', `${d.id} ${d.title}`), h('span', 'tag', solved ? '완료' : '미완료'));
      c.append(top);
      if (solved) { c.append(h('p', 'hypo', '가설: ' + d.hypo)); if (d.kind === 'final') c.append(h('p', 'sub', '(임시 안내) 아리아가 있는 도서관을 찾아가 보자.')); return c; }

      if (d.kind === 'final') {
        const st = EF.finalStatus();
        c.append(h('p', 'sub', `필수 추리 ${st.mains}/3 완료 · ${st.stageOk ? '4단계 이상 ✔' : '4단계 이상 필요'}`));
        const b = h('button', 'btn primary small', '통합 추리 기록'); b.disabled = !st.ready;
        b.onclick = () => { const r = EF.tryFinal(); r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind)); draw(); };
        c.append(b); return c;
      }
      if (active !== d) {
        c.append(h('p', 'sub', `연결할 증거 ${d.requires.length}개`));
        const b = h('button', 'btn small', '이 추리에 증거 연결'); b.onclick = () => { active = d; picks = []; message = ''; draw(); };
        c.append(b); return c;
      }
      const slots = h('div', 'slots');
      for (let i = 0; i < d.requires.length; i++) {
        const id = picks[i];
        const s = h('button', 'slot' + (id ? ' filled' : ''), id ? `${id} · ${EF.EVIDENCE[id].name}` : '비어 있음');
        s.onclick = () => { if (id) { picks.splice(i, 1); draw(); } };
        slots.append(s);
      }
      c.append(slots);
      if (message) c.append(h('p', 'msg', message));
      const row = h('div', 'row');
      const link = h('button', 'btn primary small', '연결하기'); link.disabled = picks.length !== d.requires.length;
      link.onclick = () => {
        const r = EF.tryDeduce(d.id, picks);
        r.q.forEach(i => i.t === 'toast' && UI.toast(i.text, i.kind));
        if (r.ok) { active = null; picks = []; message = ''; } else { message = '서로 이어지지 않는다. 다른 증거를 골라 보자.'; picks = []; }
        draw();
      };
      const cancel = h('button', 'btn small', '취소'); cancel.onclick = () => { active = null; picks = []; message = ''; draw(); };
      row.append(link, cancel); c.append(row);
      return c;
    }
    draw();
  };
})();

</script>
<script>
/* 개발용 패널(DEV 버튼). 장면 이동 · 증거 지급 · 상태 확인 · 초기화. 최종 배포 때는 버튼만 숨기면 된다. */
(function () {
  const EF = window.EF, h = EF.h;
  let panel;
  EF.Debug = {
    init(stage) {
      panel = h('div', 'devpanel'); panel.style.display = 'none'; stage.append(panel);
    },
    toggle() {
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
      if (panel.style.display === '') this.draw();
    },
    draw() {
      panel.innerHTML = '';
      const st = EF.state;
      panel.append(h('b', '', `DEV · 단계 ${EF.getStage()} · 흔적 ${EF.traceCount()}/13`));
      const sel = h('select'); Object.values(EF.SCENES).forEach(s => { const o = h('option', '', `${s.id} ${s.name}`); o.value = s.id; if (s.id === st.scene) o.selected = true; sel.append(o); });
      sel.onchange = () => { st.scene = sel.value; EF.UI.render(); };
      panel.append(sel);
      const ev = h('div', 'devev');
      Object.keys(EF.EVIDENCE).forEach(id => {
        const b = h('button', st.evidence[id] ? 'on' : '', id);
        b.title = EF.EVIDENCE[id].name;
        b.onclick = () => { if (st.evidence[id]) delete st.evidence[id]; else st.evidence[id] = ++st.order; EF.UI.render(); this.draw(); };
        ev.append(b);
      });
      panel.append(ev);
      const flags = h('div', 'devflags', 'flags: ' + (Object.keys(st.flags).join(', ') || '-') + ' | 퍼즐: ' + (Object.keys(st.solved).join(', ') || '-') + ' | 추리: ' + (Object.keys(st.deduced).join(', ') || '-'));
      panel.append(flags);
      const row = h('div', 'row');
      const reset = h('button', '', '전체 초기화'); reset.onclick = () => { EF.reset(); EF.UI.shown = null; EF.UI.render(); this.draw(); };
      const close = h('button', '', '닫기'); close.onclick = () => this.toggle();
      row.append(reset, close); panel.append(row);
    }
  };
})();

</script>
<script>
/* 오페라 커튼 · 무대 뒤
   1) 시작: 그림 창에 커튼이 닫혀 있고 천장에서 줄로 로고가 매달려 있다.
      누르면 로고가 줄에 끌려 천장 위로 사라지고 커튼이 오페라 막처럼 양옆 위로 걷힌다.
   2) 페이지를 아래로 스크롤하면: 그림 창 커튼이 애니메이션으로 닫힌다. 맨 위로 돌아오면 다시 열린다.
   3) 장소 설명 칸 아래 '무대 뒤' 구역: 처음엔 닫힌 문(표)만 있고, 누르면 그래픽노블 · 아트북 · 영상 책자가 펼쳐진다.
      책자는 탭이나 접힌 책장 모서리로 넘긴다(화살표 없음).
   작업물이 오면 PAGES 의 body 만 바꾸면 된다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  const PAGES = [
    { id: 'novel', tab: '그래픽노블',
      body: '<div class="ph-frame tall"><b>그래픽노블</b><span>이 자리에 EVERFREEZE 그래픽노블이 들어올 예정입니다.</span></div>' },
    { id: 'artbook', tab: '아트북',
      body: '<div class="ph-grid">' + ['캐릭터', '환경', '랜드마크', '키 비주얼'].map(t => `<div class="ph-frame"><b>${t}</b><span>아트북 이미지가 들어올 예정입니다.</span></div>`).join('') + '</div>' },
    { id: 'video', tab: '영상',
      body: '<div class="ph-frame wide"><b>영상</b><span>이 자리에 EVERFREEZE 영상이 들어올 예정입니다.</span></div>' }
  ];

  const T = { open: 1500, close: 1300, rise: 750 }; // 애니메이션 시간(ms)
  const wait = ms => new Promise(r => setTimeout(r, ms));

  UI.initStageCurtain = function () {
    const stage = UI.stage;
    // ---- 그림 창 커튼 ----
    const op = h('div', 'opera closed');
    const L = h('div', 'drape left'), R = h('div', 'drape right'), val = h('div', 'opera-valance');
    const hang = h('div', 'hang'), ropes = h('div', 'ropes'), sign = h('div', 'sign logo');
    sign.innerHTML = '<span class="logo-txt">EVERFREEZE</span>';
    hang.append(ropes, sign);
    op.append(L, R, hang, val);
    // 커튼 그림(assets/opening/open-0~3: 닫힘 → 반쯤 → 묶임 → 다 걷힘)이 있으면 그림 장면으로 열고 닫는다
    const FR = [0, 1, 2, 3].map(i => 'opening/open-' + i);
    const frames = FR.every(k => EF.artHas(k)) ? FR.map(k => EF.artSrc(k)) : null;
    let frameImg = null;
    if (frames) {
      op.classList.add('has-frames', 'shut');
      frameImg = h('img', 'op-frame'); frameImg.src = frames[0]; frameImg.alt = ''; op.insertBefore(frameImg, hang);
      frames.forEach(u => { const pre = new Image(); pre.src = u; }); // 미리 불러 둔다
    }
    stage.append(op); document.body.classList.add('stage-closed');

    // 상태: 'title'(닫힘+로고) → 'play'(열림) ⇄ 'down'(스크롤로 닫힘)
    const C = UI.curtain = { state: 'title', busy: false, el: op };
    async function run(fn, next) {
      if (C.busy) return; C.busy = true; UI.busy = true; document.body.classList.add('stage-closed');
      await fn(); C.state = next; C.busy = false; UI.busy = next !== 'play';
      document.body.classList.toggle('stage-closed', next !== 'play');
      onScroll(); // 애니메이션 중에 스크롤이 바뀌었으면 이어서 맞춘다
    }
    const step = T.open / 5;
    const openDrapes = async () => {
      op.classList.remove('closed'); op.classList.add('opening');
      if (frames) { frameImg.style.opacity = 1; for (let i = 1; i < frames.length; i++) { await wait(step); frameImg.src = frames[i]; op.classList.remove('shut'); } await wait(step); frameImg.style.opacity = 0; await wait(step); }
      else await wait(T.open);
      op.classList.remove('opening'); op.classList.add('open');
    };
    const closeDrapes = async () => {
      op.classList.remove('open'); op.classList.add('closed');
      if (frames) { frameImg.src = frames[frames.length - 1]; frameImg.style.opacity = 1; for (let i = frames.length - 2; i >= 0; i--) { await wait(T.close / 4); frameImg.src = frames[i]; } op.classList.add('shut'); }
      else await wait(T.close);
    };

    // 시작: 로고가 줄에 끌려 올라가고 → 커튼이 걷힌다
    const start = () => { if (C.state === 'title' && !C.busy) run(async () => { hang.classList.add('up'); await wait(T.rise); await openDrapes(); }, 'play').then(() => UI.onCurtainOpen && UI.onCurtainOpen()); }; // 처음 막이 열리면 안내 쪽지
    sign.onclick = e => { e.stopPropagation(); start(); };
    op.onclick = start;
    addEventListener('keydown', e => { if (C.state === 'title' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); } });

    // ---- 스크롤: 내리면 막이 내리고, 맨 위로 오면 막이 오른다 ----
    const wrap = document.getElementById('stagewrap');
    function onScroll() {
      if (C.busy || C.state === 'title') return;
      const r = wrap.getBoundingClientRect();
      const down = r.top < -r.height * 0.25;   // 그림 창이 4분의 1 넘게 위로 지나가면 닫는다
      const up = r.top > -r.height * 0.1;      // 거의 다 다시 보이면 연다
      if (down && C.state === 'play' && !UI.dismiss) run(closeDrapes, 'down');
      else if (up && C.state === 'down') run(openDrapes, 'play');
    }
    addEventListener('scroll', onScroll, { passive: true });

    // ---- 무대 뒤 구역 (장소 설명 칸 아래) ----
    const site = document.getElementById('site'), foot = document.getElementById('foot');
    const sec = h('section', 'backstage'); sec.id = 'backstage';
    const head = h('div', 'bs-head');
    head.append(h('div', 'bs-title', '무대 뒤'), h('div', 'bs-sub', '게임 속에서는 보이지 않는 이야기'));
    // 한 단계: 닫힌 무대 뒤 문(표). 누르면 책자가 펼쳐진다
    const gate = h('button', 'bs-gate');
    gate.innerHTML = '<span class="gate-txt">무대 뒤로 들어가기</span><small>그래픽노블 · 아트북 · 영상</small>';
    const book = h('div', 'program');
    const tabs = h('div', 'pg-tabs'), sheet = h('div', 'pg-sheet');
    const leaves = PAGES.map((p, i) => {
      const lf = h('div', 'pg-leaf');
      lf.innerHTML = `<div class="pg-head"><h3>${p.tab}</h3><span class="pg-no">${i + 1} / ${PAGES.length}</span></div><div class="pg-body">${p.body}</div>`;
      const nx = h('div', 'pg-corner next'), pv = h('div', 'pg-corner prev');
      nx.title = '다음 쪽'; pv.title = '앞 쪽';
      nx.onclick = () => go(i + 1); pv.onclick = () => go(i - 1);
      if (i < PAGES.length - 1) lf.append(nx);
      if (i > 0) lf.append(pv);
      sheet.append(lf);
      const t = h('button', 'pg-tab', p.tab); t.onclick = () => go(i); tabs.append(t);
      return lf;
    });
    const shut = h('button', 'pg-shut', '책자 덮기');
    book.append(tabs, sheet, shut);
    sec.append(head, gate, book);
    site.insertBefore(sec, foot);

    let cur = 0;
    function go(i) {
      if (i < 0 || i >= PAGES.length || i === cur) return;
      const d = i > cur ? 1 : -1, from = leaves[cur], to = leaves[i];

        for (let i = 1; i < fr.length; i++) { im.src = EF.artSrc(fr[i]); cv.style.background = 'none'; await wait(T.open / 5); }
        cv.classList.add('gone'); await wait(400); cv.remove();
      } else setTimeout(() => book.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
    };
    shut.onclick = () => sec.classList.remove('open');
  };
})();

<script>

  }

  // 사이트 위 검은 균열 (4단계부터 남는다)

    const W = site.scrollWidth, H = site.scrollHeight;

    cracks.innerHTML = '';

    // 균열 그림을 넣었으면(EF.CRACK_IMAGES) 그 그림을 사이트 전체에 덮는다. 없는 단계는 바로 아래 단계 그림.

      c.querySelectorAll('.closeup').forEach(e => e.classList.add('quiet'));
      box.append(c); }
    // 엔딩 창문 그림이 있으면: 그림 창 가운데를 그 창문으로 바꾸고, 아리아는 '아리아가 비친 창문' 그림이 서서히 겹쳐 나타난다
    const winArt = EF.artHas('ending/ending-window') ? box.querySelector('.closeup') : null;
    let ariaLayer = null;
    if (winArt) {
      winArt.innerHTML = ''; winArt.classList.add('fin-win');
      winArt.style.background = `url(${EF.artSrc('ending/ending-window')}) center/cover no-repeat`;
      if (EF.artHas('ending/ending-window-aria')) {
        ariaLayer = document.createElement('div'); ariaLayer.className = 'fin-win-aria';
        ariaLayer.style.background = `url(${EF.artSrc('ending/ending-window-aria')}) center/cover no-repeat`;
        winArt.append(ariaLayer);
      }
    }
    // 창문 건너편의 아리아 (유리 뒤)
    const aria = document.createElement('div'); aria.className = 'fin-aria';
    const img = EF.ENDING_ARIA_IMAGE;
    if (img) aria.style.backgroundImage = `url(${img})`;
    else aria.innerHTML = `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet">
      <path d="M100 30c-30 0-48 23-48 53 0 27 9 41 16 52l-5 30c-36 12-52 40-57 84L2 300h196l-4-51c-5-44-21-72-57-84l-5-30c7-11 16-25 16-52 0-30-18-53-48-53z" fill="#17121e"/>
      <path d="M52 82c-4 36 2 82-11 124 20-11 27-36 27-62M148 82c4 36-2 82 11 124-20-11-27-36-27-62" fill="#17121e"/>
      <ellipse cx="84" cy="88" rx="5.5" ry="3" fill="#f4eefc"/><ellipse cx="116" cy="88" rx="5.5" ry="3" fill="#f4eefc"/></svg>`;
    const glass = document.createElement('div'); glass.className = 'fin-glass'; // 유리에 비친 빛 (아리아 위에 얹힘)
    const pane = document.createElement('div'); pane.className = 'fin-pane'; // 창문 유리 칸: 이 안에서만 아리아가 보인다
    pane.append(aria, glass);
    box.append(pane);
    place(); document.body.append(box);
    // 유리 칸의 위치: 임시 창문 아이콘이면 그 유리 부분, 창문 그림을 넣었으면 EF.ENDING_WINDOW_PANE(그림 창 기준 %)
    const placePane = () => {
      const br = box.getBoundingClientRect(), ico = box.querySelector('.cv-icon');
      let x, y, w, hh;
      if (ico && ico.firstChild) {
        const rg = document.createRange(); rg.selectNodeContents(ico); const r = rg.getBoundingClientRect();
        const g = Math.min(r.width, r.height); // 아이콘 글자 크기
        w = g * .72; hh = g * .73; x = r.left + (r.width - w) / 2 - br.left; y = r.top + (r.height - hh) / 2 + g * .075 - br.top; // 글자 상자 안 창문 그림의 유리 부분
        pane.classList.add('bars'); pane.style.setProperty('--bar', Math.max(4, g * .042) + 'px');
      } else {
        const P = EF.ENDING_WINDOW_PANE || [38, 26, 24, 48];
        x = br.width * P[0] / 100; y = br.height * P[1] / 100; w = br.width * P[2] / 100; hh = br.height * P[3] / 100;
      }
      Object.assign(pane.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px' });
    };
    if (winArt) pane.remove(); else placePane();
    addEventListener('resize', () => { place(); if (!winArt) placePane(); });
    // 1) 갑자기: 모든 오류가 한꺼번에 심해진다
    every(60, () => scatter(Math.ceil(rnd(5, 12 + lvl * 20)), true));
    every(110, () => band(pick(['inv', 'hue', 'gap', 'gap'])));
    every(140, () => pixels(Math.ceil(rnd(4, 10))));
    every(260, shove);
    every(90, () => { const ns = textNodes(); if (ns.length) corrupt(pick(ns), .25 + lvl * .5, rnd(200, 600)); });
    every(500, tabTitle);
    const t0 = performance.now();
    every(100, () => setLvl(Math.min(.85, (performance.now() - t0) / T.takeover * .85))); // 막이 점점 짙어진다
    // 2) 창문이 뜨고 2초 뒤: 창문 건너편에 아리아가 나타나 가만히 바라본다 → 사라진다
    at(T.aria, () => (ariaLayer || aria).classList.add('on'));
    at(T.ariaGone, () => (ariaLayer || aria).classList.add('gone'));
    // 3) 오류가 화면을 장악한다 → 창문도 삼켜진다 → 암전 → 강제 초기화
    at(T.takeover, () => { setLvl(1); veil.classList.add('full'); document.body.classList.add('finale-max'); box.classList.add('cracking'); });
    at(T.swallow, () => box.classList.add('gone'));
    at(T.black, () => { timers.forEach(clearInterval); timers = []; layer.innerHTML = ''; box.remove(); veil.classList.add('black'); document.title = '▒▒▒▒▒▒▒▒▒'; });
    at(T.reset, () => { location.href = location.pathname + location.search; }); // 주소의 #장면 을 지우고 처음부터
  };
})();

</script>
<script>
/* 친절한 안내
   1) 처음 막이 열리면 안내 쪽지 4장 (누를 곳 · 이동 · 단서와 힌트 · 세계의 어긋남과 무대 뒤)
   2) 그림 창 바로 위(머리글 점선 아래): [월드맵] 버튼(마을 지도·세부 장소에서) · [도움말] 버튼(언제든 안내 쪽지 다시 보기) · [처음부터] 버튼(사이트 초기화)
   3) 처음 한 번만 뜨는 짧은 도움말(그림 창 위쪽): 처음 흔들림 · 처음 퍼즐 · 처음 단계가 오를 때
   문장은 아래 PAGES · TIPS 에서 고친다. */
(function () {
  const EF = window.EF, UI = EF.UI, h = EF.h;

  const PAGES = [
    { title: 'EVERFREEZE에 오신 것을 환영해요',
      body: '세 마을을 돌아다니며 그림 속 물건과 사람을 눌러 살펴보세요.\n마우스를 올렸을 때 테두리가 생기는 곳이 누를 수 있는 곳이에요.\n사람을 누르면 이야기를 나눌 수 있어요.' },
    { title: '돌아다니는 방법',
      body: '마을과 장소를 눌러 안으로 들어가요.\n그림 아래쪽 ▼ 를 누르면 한 단계 뒤로 돌아가요.\n그림 창 위 [월드맵] 버튼을 누르면 언제든 처음 지도로 돌아가요.\n물건을 가까이 본 화면에서도 ▼ 를 누르면 원래 장면으로 돌아가요.' },
    { title: '단서와 퍼즐',
      body: '물건을 누르면 가까이 들여다볼 수 있어요.\n그 안에 숫자나 기호가 숨어 있기도 해요.\n한 마을의 퍼즐 단서는 다른 마을에 있어요.\n여러 마을을 오가며 기억해 두세요.\n퍼즐을 3번 틀리면 힌트가 나와요.\n그림이 흔들리는 곳은 아직 열리지 않은 곳이에요.' },
    { title: '무언가 이상하다면',
      body: '단서를 모을수록 세계가 조금씩 어긋나고, 그때마다 새로운 곳이 열려요.\n막힐 때는 아직 가 보지 않은 장소나\n다시 말을 걸어 보지 않은 사람을 찾아보세요.\n페이지를 아래로 내리면 \'무대 뒤\' 이야기도 볼 수 있어요.' }
  ];
  const TIPS = {
    shake:  '아직은 열 수 없어요. 다른 곳을 먼저 둘러보세요.',
    puzzle: '3번 틀리면 힌트가 나와요. 닫아도 괜찮아요. (Esc)',
    stage:  '세계가 어긋나기 시작했어요. 새로운 곳이 열렸을지도 몰라요.'
  };

  const seen = {}; // 이번 방문에서 이미 보여 준 도움말

  // ---- 처음 한 번만 뜨는 짧은 도움말 (누르기를 막지 않는다) ----
  function tip(key) {
    if (seen[key]) return; seen[key] = true;
    const t = h('div', 'gtip', TIPS[key]);
    UI.stage.append(t);
    requestAnimationFrame(() => t.classList.add('on'));
    setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 500); }, 4200);
  }
  function note(text) { // 상황에 따른 도움말 (매번)
    UI.stage.querySelectorAll('.gtip').forEach(t => t.remove());
    const t = h('div', 'gtip', text); UI.stage.append(t);
    requestAnimationFrame(() => t.classList.add('on'));
    setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 500); }, 5200);
  }
  EF.Guide = { tip, note };
  const wrap = (name, key) => { const f = UI[name]; UI[name] = function () { tip(key); return f.apply(this, arguments); }; };
  wrap('shake', 'shake'); wrap('showPuzzle', 'puzzle'); // ▼ 돌아가기 안내는 [도움말]에만 둔다
  const banner = UI.banner; UI.banner = function () { banner.apply(this, arguments); setTimeout(() => tip('stage'), 1200); };

  // ---- 안내 쪽지 ----
  function openGuide() {
    if (UI.busy || UI.dismiss) return;
    UI.busy = true;
    const sc = h('div', 'scrim dim guide-scrim'), card = h('div', 'guide');
    const title = h('h3'), body = h('div', 'g-body'), dots = h('div', 'g-dots');
    const prev = h('button', 'btn', '이전'), next = h('button', 'btn primary');
    const nav = h('div', 'g-nav'); nav.append(prev, dots, next);
    card.append(title, body, nav); sc.append(card); UI.stage.append(sc);
    let i = 0;
    const draw = () => {
      title.textContent = PAGES[i].title; body.textContent = PAGES[i].body;
      dots.innerHTML = PAGES.map((_, j) => `<span class="${j === i ? 'on' : ''}"></span>`).join('');
      prev.style.visibility = i ? 'visible' : 'hidden';
      next.textContent = i === PAGES.length - 1 ? '시작하기' : '다음';
    };
    const close = () => { sc.remove(); UI.dismiss = null; UI.busy = false; UI.render(); };
    const go = d => { i += d; if (i >= PAGES.length) close(); else { i = Math.max(0, i); draw(); } };
    next.onclick = () => go(1); prev.onclick = () => go(-1);
    UI.dismiss = () => go(1); // Enter/Space: 다음 장, 마지막 장에서 닫힘. Esc 도 다음/닫기
    draw();
  }
  EF.Guide.open = openGuide;

  // ---- 사이트 초기화: 확인한 뒤 처음 상태(닫힌 막 · 1단계)로 다시 연다 ----
  function askReset() {
    if (UI.busy || UI.dismiss) return;
    UI.busy = true;
    const sc = h('div', 'scrim dim guide-scrim'), card = h('div', 'guide confirm');
    const yes = h('button', 'btn primary', '예, 처음부터'), no = h('button', 'btn', '아니요');
    const nav = h('div', 'g-nav'); nav.append(no, yes);
    card.append(h('h3', '', '처음부터 다시 할까요?'), h('div', 'g-body', '모은 단서와 풀어 둔 퍼즐, 세계의 어긋남이 모두 사라지고\n막이 닫힌 첫 화면으로 돌아가요.'), nav);
    sc.append(card); UI.stage.append(sc);
    const close = () => { sc.remove(); UI.dismiss = null; UI.busy = false; };
    no.onclick = close; UI.dismiss = close; // Esc/Enter: 취소 (실수로 지우지 않게)
    yes.onclick = () => { location.href = location.pathname + location.search; }; // 주소의 #장면 을 지우고 새로 연다
  }
  EF.Guide.reset = askReset;

  // ---- 그림 창 왼쪽 위 버튼 ----
  UI.initGuide = function () {
    const bar = h('div', 'stage-tags pre'); // 머리글 점선 아래, 그림 창 바로 위
    const map = h('button', 'stag map', '월드맵'), help = h('button', 'stag help', '도움말'), reset = h('button', 'stag reset', '처음부터');
    reset.title = '사이트 초기화';
    reset.onclick = e => { e.stopPropagation(); askReset(); };
    map.title = '월드맵으로 돌아가기'; help.title = '안내 다시 보기';
    map.onclick = e => { e.stopPropagation(); if (UI.busy) return; EF.state.scene = 'WORLD_MAP'; UI.render(); };
    help.onclick = e => { e.stopPropagation(); openGuide(); };
    bar.append(reset, help, map); // 순서: 처음부터 · 도움말 · 월드맵
    // 지금 누를 수 없는 버튼(클로즈업 · 대화 · 퍼즐 · 안내 창이 열려 있을 때)은 색을 빼서 꺼진 것처럼 보이게 한다
    const sync = () => {
      const off = !!(UI.busy || UI.dismiss);
      [reset, help, map].forEach(b => { b.classList.toggle('off', off); b.disabled = off; b.setAttribute('aria-disabled', off); });
    };
    setInterval(sync, 150); sync();
    const wrap = document.getElementById('stagewrap'); wrap.parentNode.insertBefore(bar, wrap);
    UI.guideBar = { bar, map };
    map.style.display = EF.SCENES[EF.state.scene].kind === 'world' ? 'none' : '';
  };
  // 장면이 바뀔 때: 월드맵에서는 [월드맵] 버튼을 숨긴다
  const render = UI.render;
  UI.render = function () {
    const r = render.apply(this, arguments);
    if (UI.guideBar) UI.guideBar.map.style.display = EF.SCENES[EF.state.scene].kind === 'world' ? 'none' : '';
    return r;
  };
  // 처음 막이 열렸을 때 안내 쪽지
  UI.onCurtainOpen = function () { if (UI.guideBar) UI.guideBar.bar.classList.remove('pre'); if (!seen.welcome) { seen.welcome = true; openGuide(); } };
})();

</script>
<script>
/* 시작: 타이틀 없이 월드맵에서 바로 시작. */
document.addEventListener('DOMContentLoaded', () => window.EF.UI.init());

</script>
